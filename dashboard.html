<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102A43">
  <title>Dashboard | Bright Minds Tutorials</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #102A43;
      --teal: #00B8A9;
      --ink: #243B53;
      --muted: #627D98;
      --bg: #F4F7FA;
      --white: #FFFFFF;
      --border: #D9E2EC;
      --danger: #C0392B;
      --shadow: 0 12px 30px rgba(16,42,67,.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .app { min-height: 100vh; }

    :focus-visible {
      outline: 3px solid rgba(0,184,169,.55);
      outline-offset: 3px;
    }

    .card {
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #C5D5E4;
      box-shadow: 0 16px 34px rgba(16,42,67,.11);
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 250px;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      background: var(--navy);
      color: white;
      padding: 26px 18px;
      display: flex;
      flex-direction: column;
      z-index: 20;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(188,204,220,.42) transparent;
      scroll-behavior: smooth;
    }

    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(188,204,220,.35);
      border-radius: 99px;
    }
    .sidebar::-webkit-scrollbar-thumb:hover {
      background: rgba(188,204,220,.6);
    }

    .sidebar .brand,
    .sidebar .nav-label,
    .sidebar .nav,
    .sidebar .sidebar-bottom {
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 28px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: white;
      color: var(--navy);
      display: grid;
      place-items: center;
      font: 800 24px "Manrope", sans-serif;
      position: relative;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--teal);
      right: 5px;
      top: 5px;
    }

    .brand-name {
      font: 800 16px "Manrope", sans-serif;
      line-height: 1.2;
    }

    .brand-name span { color: var(--teal); }

    .brand-sub {
      color: #BCCCDC;
      font-size: 10px;
      margin-top: 4px;
    }

    .nav-label {
      color: #9FB3C8;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      padding: 18px 12px 9px;
    }

    .nav { display: grid; gap: 6px; }

    .nav button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #D9E2EC;
      text-align: left;
      border-radius: 10px;
      padding: 12px 13px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-weight: 600;
      font-size: 14px;
    }

    .nav button:hover,
    .nav button.active {
      background: rgba(255,255,255,.12);
      color: white;
    }

    .nav button.active {
      box-shadow: inset 3px 0 var(--teal);
    }

    .nav-icon {
      width: 19px;
      text-align: center;
      color: #7FE3DA;
    }

    .sidebar-bottom {
      margin-top: auto;
      border-top: 1px solid rgba(255,255,255,.15);
      padding: 18px 8px 0;
      color: #BCCCDC;
      font-size: 12px;
    }

    .main {
      margin-left: 250px;
      min-height: 100vh;
    }

    .topbar {
      min-height: 76px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 34px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .page-title {
      font: 800 20px "Manrope", sans-serif;
      color: var(--navy);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #D9F7F4;
      color: var(--navy);
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .user-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
    }

    .user-role {
      font-size: 11px;
      color: var(--muted);
      text-transform: capitalize;
      margin-top: 2px;
    }

    .content {
      padding: 30px 34px 50px;
      max-width: 1400px;
      margin: auto;
    }

    .welcome { margin-bottom: 25px; }

    .welcome h1 {
      margin: 0 0 7px;
      font: 800 26px "Manrope", sans-serif;
      color: var(--navy);
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
    }

    .grid { display: grid; gap: 18px; }

    .stats {
      grid-template-columns: repeat(3, minmax(0,1fr));
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 21px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .stat-value {
      color: var(--navy);
      font: 800 28px "Manrope", sans-serif;
      margin-top: 10px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 26px 0 14px;
    }

    .section-head h2 {
      margin: 0;
      color: var(--navy);
      font: 800 18px "Manrope", sans-serif;
    }

    .muted { color: var(--muted); }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 10px 15px;
      font-weight: 700;
      background: var(--teal);
      color: white;
    }

    .btn:hover { filter: brightness(.95); }

    .btn.secondary {
      background: #E6FFFB;
      color: #087F78;
    }

    .btn.danger {
      background: #FDECEC;
      color: var(--danger);
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .table-wrap { overflow-x: auto; }

    .table {
      width: 100%;
      border-collapse: collapse;
      min-width: 560px;
    }

    .table th, .table td {
      padding: 13px 12px;
      border-bottom: 1px solid #EAF0F5;
      text-align: left;
      font-size: 13px;
    }

    .table th {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .pill {
      display: inline-block;
      border-radius: 30px;
      padding: 5px 9px;
      background: #E6FFFB;
      color: #087F78;
      font-size: 11px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .empty {
      padding: 30px 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    .alert {
      padding: 13px 15px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 13px;
      display: none;
    }

    .alert.error {
      display: block;
      background: #FFF1F0;
      color: #9B2C2C;
      border: 1px solid #FED7D7;
    }

    .alert.success {
      display: block;
      background: #E6FFFB;
      color: #087F78;
      border: 1px solid #B2F5EA;
    }

    .loading {
      padding: 25px;
      color: var(--muted);
      text-align: center;
    }

    .mobile-menu {
      display: none;
      border: 0;
      background: #E6FFFB;
      color: var(--navy);
      border-radius: 8px;
      padding: 9px 12px;
    }

    .hidden { display: none !important; }

    .form {
      display: grid;
      gap: 12px;
      max-width: 520px;
    }

    .form label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .form input,
    .form select,
    .form textarea {
      width: 100%;
      margin-top: 6px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--ink);
      background: white;
    }

    .inline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    @media(max-width:900px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform .24s ease;
        box-shadow: 18px 0 40px rgba(16,42,67,.18);
      }

      .sidebar.open { transform: translateX(0); }

      .sidebar-backdrop {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 15;
        border: 0;
        padding: 0;
        background: rgba(10,25,41,.42);
        opacity: 0;
        visibility: hidden;
        transition: opacity .2s ease, visibility .2s ease;
      }

      .sidebar-backdrop.open {
        opacity: 1;
        visibility: visible;
      }
      .main { margin-left: 0; }
      .mobile-menu { display: inline-block; }
      .topbar { padding: 13px 18px; }
      .content { padding: 24px 18px 40px; }
    }

    @media(max-width:620px) {
      .stats { grid-template-columns: 1fr; }
      .user-details { display: none; }
      .welcome h1 { font-size: 22px; }
      .content { padding: 20px 14px 35px; }
      .topbar { padding: 12px 14px; }
    }
  </style>
</head>

<body>
  <div class="app">

    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <div class="brand-mark">B</div>
        <div>
          <div class="brand-name">Bright <span>Minds</span></div>
          <div class="brand-sub">TUTORIALS · LEARN. UNDERSTAND. EXCEL.</div>
        </div>
      </div>

      <div class="nav-label">WORKSPACE</div>

      <nav class="nav" id="mainNav">
        <button class="active" data-page="overview">
          <span class="nav-icon">⌂</span>Overview
        </button>

        <button data-page="courses">
          <span class="nav-icon">▣</span>My courses
        </button>

        <button data-page="payments">
          <span class="nav-icon">₵</span>Subscribe &amp; payments
        </button>

        <button data-page="assessments">
          <span class="nav-icon">✓</span>Assessments
        </button>

        <button data-page="announcements">
          <span class="nav-icon">◉</span>Announcements
        </button>

        <button data-page="profile">
          <span class="nav-icon">○</span>My profile
        </button>
      </nav>

      <div class="nav-label hidden" id="adminLabel">
        ADMINISTRATION
      </div>

      <nav class="nav hidden" id="adminNav">
        <button data-page="manage-courses">
          <span class="nav-icon">▤</span>Manage courses
        </button>

        <button data-page="manage-resources">
          <span class="nav-icon">⇧</span>Tutorial materials
        </button>

        <button data-page="manage-announcements">
          <span class="nav-icon">✎</span>Manage announcements
        </button>

        <button data-page="payments">
          <span class="nav-icon">₵</span>Review payments
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div>Bright Minds Tutorials</div>
        <div style="margin-top:5px">Learn. Understand. Excel.</div>
      </div>

    </aside>

    <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Close navigation" tabindex="-1"></button>

    <main class="main">

      <header class="topbar">

        <div style="display:flex;align-items:center;gap:12px">
          <button class="mobile-menu" id="menuToggle" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
          <div class="page-title" id="pageTitle">Overview</div>
        </div>

        <div class="top-right">

          <div class="user">
            <div class="avatar" id="userAvatar">B</div>

            <div class="user-details">
              <div class="user-name" id="userName">Loading…</div>
              <div class="user-role" id="userRole">Student</div>
            </div>
          </div>

          <button class="btn secondary" id="signOutBtn">
            Sign out
          </button>

        </div>

      </header>

      <section class="content">

        <div id="alertBox" class="alert"></div>

        <div id="pageContent">
          <div class="loading">Loading your Bright Minds dashboard…</div>
        </div>

      </section>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.BRIGHT_MINDS_CONFIG || {};

      const supabaseUrl = config.SUPABASE_URL;
      const supabaseKey = config.SUPABASE_KEY;

      const pageContent = document.getElementById("pageContent");
      const alertBox = document.getElementById("alertBox");
      const pageTitle = document.getElementById("pageTitle");

      let supabaseClient = null;
      let currentUser = null;
      let currentProfile = null;
      let currentPage = "overview";

      const titles = {
        overview: "Overview",
        courses: "My courses",
        assessments: "Assessments",
        announcements: "Announcements",
        profile: "My profile",
        "manage-courses": "Manage courses",
        "manage-resources": "Tutorial materials",
        "manage-announcements": "Manage announcements",
        payments: "Payments"
      };

      function showAlert(message, type = "error") {
        alertBox.textContent = message;
        alertBox.className = "alert " + type;
      }

      function clearAlert() {
        alertBox.textContent = "";
        alertBox.className = "alert";
      }

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char]));
      }

      function initials(name) {
        return String(name || "Bright Minds")
          .trim()
          .split(/\s+/)
          .slice(0, 2)
          .map(part => part[0] || "")
          .join("")
          .toUpperCase();
      }

      function setLoading(message = "Loading…") {
        pageContent.innerHTML =
          `<div class="loading">${escapeHTML(message)}</div>`;
      }

      function isAdmin() {
        return currentProfile && currentProfile.role === "admin";
      }

      async function init() {

        if (!window.supabase || !supabaseUrl || !supabaseKey) {
          pageContent.innerHTML = `
            <div class="empty">
              Supabase configuration could not be loaded.
              Check that supabase-config.js exists and contains
              the project URL and publishable/anon key.
            </div>`;
          return;
        }

        supabaseClient = window.supabase.createClient(
          supabaseUrl,
          supabaseKey
        );

        const {
          data: { session },
          error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError) {
          showAlert(sessionError.message);
          return;
        }

        if (!session) {
          window.location.replace("./login.html");
          return;
        }

        currentUser = session.user;

        const { data: profile, error: profileError } =
          await supabaseClient
            .from("profiles")
            .select("full_name, role")
            .eq("id", currentUser.id)
            .single();

        if (profileError || !profile) {
          pageContent.innerHTML = `
            <div class="empty">
              We could not load your account profile.
              Please contact Bright Minds support.
            </div>`;

          showAlert(
            profileError
              ? profileError.message
              : "Your profile record was not found."
          );

          return;
        }

        currentProfile = profile;

        document.getElementById("userName").textContent =
          profile.full_name || currentUser.email || "Bright Minds user";

        document.getElementById("userRole").textContent =
          profile.role || "student";

        document.getElementById("userAvatar").textContent =
          initials(profile.full_name || currentUser.email);

        if (isAdmin()) {
          document.getElementById("adminLabel")
            .classList.remove("hidden");

          document.getElementById("adminNav")
            .classList.remove("hidden");
        }

        await renderPage("overview");
      }

      async function renderPage(page) {

        if (!titles[page]) return;

        if (page.startsWith("manage-") && !isAdmin()) {
          showAlert("You do not have permission to open that page.");
          return;
        }

        currentPage = page;
        pageTitle.textContent = page === "payments" && !isAdmin() ? "Subscribe & payments" : titles[page];

        document.querySelectorAll("#mainNav button, #adminNav button")
          .forEach(button => {
            button.classList.toggle(
              "active",
              button.dataset.page === page
            );
          });

        document.getElementById("sidebar")
          .classList.remove("open");

        clearAlert();
        setLoading();

        try {

          if (page === "overview") {
            await renderOverview();
          }

          else if (page === "courses") {
            await renderCourses();
          }

          else if (page === "assessments") {
            renderPlaceholder(
              "Assessments and results will appear here when the assessment module is connected."
            );
          }

          else if (page === "announcements") {
            await renderAnnouncements(false);
          }

          else if (page === "profile") {
            renderProfile();
          }

          else if (page === "manage-courses") {
            await renderManageCourses();
          }

          else if (page === "manage-resources") {
            await renderAdminResources();
          }

          else if (page === "manage-announcements") {
            await renderAnnouncements(true);
          }

          else if (page === "payments") {
            if (isAdmin()) await renderAdminPayments();
            else await renderStudentPayments();
          }

        } catch (error) {
          pageContent.innerHTML = `
            <div class="empty">
              This section could not be loaded.
            </div>`;

          showAlert(error.message || "An unexpected error occurred.");
        }
      }

      async function getMySubscriptions() {

        const { data, error } = await supabaseClient
          .from("subscriptions")
          .select(`
            id,
            course_id,
            status,
            start_date,
            end_date,
            courses (
              id,
              title,
              description,
              subject
            )
          `)
          .eq("student_id", currentUser.id)
          .eq("status", "active");

        if (error) throw error;

        const now = Date.now();

        return (data || []).filter(item =>
          (!item.start_date || new Date(item.start_date).getTime() <= now) &&
          (!item.end_date || new Date(item.end_date).getTime() >= now)
        );
      }

      async function renderOverview() {

        if (isAdmin()) {

          const [
            coursesResult,
            studentsResult,
            paymentsResult
          ] = await Promise.all([

            supabaseClient
              .from("courses")
              .select("id", { count: "exact", head: true }),

            supabaseClient
              .from("profiles")
              .select("id", { count: "exact", head: true })
              .eq("role", "student"),

            supabaseClient
              .from("payments")
              .select("id", { count: "exact", head: true })
              .eq("status", "pending")

          ]);

          if (coursesResult.error) throw coursesResult.error;
          if (studentsResult.error) throw studentsResult.error;
          if (paymentsResult.error) throw paymentsResult.error;

          pageContent.innerHTML = `
            <div class="welcome">
              <h1>Welcome back, ${escapeHTML(currentProfile.full_name || "Administrator")}.</h1>
              <p>Here is an overview of your learning platform.</p>
            </div>

            <div class="grid stats">

              <div class="card">
                <div class="stat-label">Total courses</div>
                <div class="stat-value">${coursesResult.count ?? 0}</div>
              </div>

              <div class="card">
                <div class="stat-label">Student accounts</div>
                <div class="stat-value">${studentsResult.count ?? 0}</div>
              </div>

              <div class="card">
                <div class="stat-label">Pending payments</div>
                <div class="stat-value">${paymentsResult.count ?? 0}</div>
              </div>

            </div>

            <div class="card">
              <h2 style="margin:0 0 8px;color:var(--navy);font:800 18px Manrope">
                Administration
              </h2>

              <p class="muted">
                Use the navigation to manage courses and publish announcements.
                Payments must only be verified after confirmation from the payment provider.
              </p>
            </div>
          `;

        } else {

          const subscriptions = await getMySubscriptions();

          pageContent.innerHTML = `
            <div class="welcome">
              <h1>Welcome back, ${escapeHTML(currentProfile.full_name || "Student")}.</h1>
              <p>Continue learning and keep making progress.</p>
            </div>

            <div class="grid stats">

              <div class="card">
                <div class="stat-label">Active subscriptions</div>
                <div class="stat-value">${subscriptions.length}</div>
              </div>

              <div class="card">
                <div class="stat-label">Learning platform</div>
                <div class="stat-value" style="font-size:19px;margin-top:15px">
                  Bright Minds
                </div>
              </div>

              <div class="card">
                <div class="stat-label">Account status</div>
                <div class="stat-value" style="font-size:19px;margin-top:15px">
                  Active
                </div>
              </div>

            </div>

            <div class="section-head">
              <h2>Your courses</h2>
              <button class="btn secondary" data-go="courses">
                View courses
              </button>
            </div>

            ${
              subscriptions.length
                ? `
                  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">
                    ${subscriptions.slice(0, 3).map(item => `
                      <div class="card">
                        <span class="pill">Active</span>

                        <h3 style="color:var(--navy);margin:13px 0 6px">
                          ${escapeHTML(item.courses?.title || "Course")}
                        </h3>

                        <p class="muted" style="font-size:13px">
                          ${escapeHTML(item.courses?.subject || "")}
                        </p>
                      </div>
                    `).join("")}
                  </div>
                `
                : `
                  <div class="empty">
                    <strong style="display:block;color:var(--navy);margin-bottom:6px">You have not subscribed to a course yet.</strong>
                    Choose the tutorial courses you need, complete your mobile money payment and send the receipt through WhatsApp. Your access will be activated after verification.

      async function showPriceForm(courseId, courseTitle) {
        const host = document.getElementById("priceFormHost");
        const result = await supabaseClient
          .from("course_subscription_prices")
          .select("id,duration_months,price,currency,is_available")
          .eq("course_id", courseId)
          .order("duration_months");
        if (result.error) {
          showAlert(result.error.message || "Could not load subscription prices.");
          return;
        }

        host.innerHTML = '<div style="border-top:1px solid var(--border);padding-top:18px;margin-top:18px">' +
          '<h3 style="color:var(--navy);margin:0 0 12px">Subscription prices · ' + escapeHTML(courseTitle) + '</h3>' +
          '<form class="form" id="priceForm"><label>Subscription period<select name="duration_months" required><option value="1">1 month</option><option value="3">3 months</option><option value="6">6 months</option></select></label>' +
          '<label>Price (ZMW)<input name="price" type="number" min="0.01" step="0.01" required placeholder="e.g. 150.00"></label>' +
          '<div class="inline-actions"><button class="btn" type="submit">Save price</button><button class="btn secondary" type="button" id="closePriceForm">Close</button></div></form>' +
          '<div style="margin-top:16px">' +
          (result.data && result.data.length ? result.data.map(price =>
            '<div class="inline-actions" style="justify-content:space-between;border-bottom:1px solid #EAF0F5;padding:10px 0"><span>' +
            price.duration_months + ' month(s) · ' + money(price.price) + ' ZMW · ' + (price.is_available ? "Available" : "Hidden") +
            '</span><button class="btn secondary" type="button" data-price-toggle="' + escapeHTML(price.id) + '" data-price-active="' + price.is_available + '">' +
            (price.is_available ? "Hide" : "Make available") + '</button></div>'
          ).join("") : '<div class="empty">No subscription prices have been set for this course.</div>') +
          '</div></div>';

        document.getElementById("closePriceForm").addEventListener("click", () => host.replaceChildren());
        document.getElementById("priceForm").addEventListener("submit", async event => {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          const duration = Number(form.get("duration_months"));
          const price = Number(form.get("price"));
          if (![1, 3, 6].includes(duration) || !Number.isFinite(price) || price <= 0) {
            showAlert("Enter a valid subscription period and positive price.");
            return;
          }
          try {
            const saved = await supabaseClient.from("course_subscription_prices").insert({
              course_id: courseId, duration_months: duration, price,
              currency: "ZMW", is_available: true
            });
            if (saved.error) throw saved.error;
            showAlert("Subscription price saved.", "success");
            await renderManageCourses();
            await showPriceForm(courseId, courseTitle);
          } catch (error) {
            showAlert(error.message || "Could not save the price. This period may already exist.");
          }
        });
        host.querySelectorAll("[data-price-toggle]").forEach(button => {
          button.addEventListener("click", async () => {
            const update = await supabaseClient.from("course_subscription_prices")
              .update({ is_available: button.dataset.priceActive !== "true" })
              .eq("id", button.dataset.priceToggle);
            if (update.error) {
              showAlert(update.error.message || "Could not update this price.");
              return;
            }
            await renderManageCourses();
            await showPriceForm(courseId, courseTitle);
          });
        });
      }

      async function toggleCourse(id, currentlyPublished) {

        if (!currentlyPublished) {
          const prices = await supabaseClient.from("course_subscription_prices")
            .select("id", { count: "exact", head: true })
            .eq("course_id", id)
            .eq("is_available", true);
          if (prices.error) {
            showAlert(prices.error.message || "Could not check course prices.");
            return;
          }
          if (!prices.count) {
            showAlert("Add at least one available subscription price before publishing this course.");
            return;
          }
        }

        const action = currentlyPublished ? "unpublish" : "publish";

        if (!confirm(`Are you sure you want to ${action} this course?`)) {
          return;
        }

        try {

          const { error } = await supabaseClient
            .from("courses")
            .update({ is_published: !currentlyPublished })
            .eq("id", id);

          if (error) throw error;

          showAlert(
            `Course ${currentlyPublished ? "unpublished" : "published"} successfully.`,
            "success"
          );

          await renderManageCourses();

        } catch (error) {
          showAlert(error.message || "Could not update the course.");
        }
      }

            }
            if (!values.get("payment_method")) {
              showAlert("Choose the mobile money method you used.");
              return;
            }
            submitButton.disabled = true;
            submitButton.textContent = "Submitting payment…";
            try {
              const result = await supabaseClient.rpc("submit_manual_payment", {
                p_course_ids: selectedCourseIds,
                p_payment_method: values.get("payment_method"),
                p_transaction_reference: values.get("transaction_reference"),
                p_proof_path: null
              });
              if (result.error) throw result.error;

              showAlert("Your payment details have been submitted. Please make sure you have sent your screenshot or receipt to either official Bright Minds WhatsApp number. Course access starts after verification.", "success");
              await renderStudentPayments();
            } catch (error) {
              showAlert(error.message || "Your payment could not be submitted.");
              submitButton.disabled = false;
              submitButton.textContent = "Submit payment for review";
            }
          });
        }
      }

      async function openPaymentProof(path) {
        const result = await supabaseClient.storage
          .from("payment-proofs")
          .createSignedUrl(path, 300);
        if (result.error) {
          showAlert(result.error.message || "The proof file could not be opened.");
          return;
        }
        window.open(result.data.signedUrl, "_blank", "noopener,noreferrer");
      }

      async function renderAdminPayments() {
        const { data, error } = await supabaseClient
          .from("payments")
          .select("id,student_id,total_amount,currency,payment_method,status,transaction_reference,proof_of_payment_url,verification_notes,created_at,profiles!payments_student_id_fkey(full_name),payment_items(id,course_title,price_at_purchase,duration_months)")
          .order("created_at", { ascending: false });

        if (error) throw error;

        const pending = (data || []).filter(payment => payment.status === "pending");
        const reviewed = (data || []).filter(payment => payment.status !== "pending");

        function paymentCard(payment, allowReview) {
          const name = payment.profiles?.full_name || "Student";
          const items = (payment.payment_items || []).map(item =>
            escapeHTML(item.course_title) + " · " + money(item.price_at_purchase) +
            (item.duration_months ? " · " + item.duration_months + " month(s)" : "")
          ).join("<br>");
          const proofAction = payment.proof_of_payment_url
            ? '<button class="btn secondary" type="button" data-open-proof="' + escapeHTML(payment.proof_of_payment_url) + '">View uploaded proof</button>'
            : '<p class="muted" style="font-size:12px;margin:8px 0">Student was instructed to send the payment screenshot/receipt to the official Bright Minds WhatsApp lines. Confirm receipt on WhatsApp before approving.</p>';
          return '<article class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><strong>' + escapeHTML(name) + '</strong><span class="pill">' + escapeHTML(payment.status) + '</span></div><h3 style="color:var(--navy);margin:12px 0 6px">' + money(payment.total_amount) + ' ' + escapeHTML(payment.currency || "ZMW") + '</h3><p style="line-height:1.6">' + (items || "Course payment") + '</p><p class="muted" style="font-size:12px">Method: ' + escapeHTML(payment.payment_method) + '<br>Reference: ' + escapeHTML(payment.transaction_reference || "—") + '<br>Submitted: ' + new Date(payment.created_at).toLocaleString() + '</p><div class="inline-actions">' + proofAction + (allowReview ? '<button class="btn" type="button" data-review-payment="' + escapeHTML(payment.id) + '" data-decision="verified">Approve and activate</button><button class="btn danger" type="button" data-review-payment="' + escapeHTML(payment.id) + '" data-decision="rejected">Reject</button>' : '') + '</div>' + (payment.verification_notes ? '<p class="muted" style="font-size:12px">Review note: ' + escapeHTML(payment.verification_notes) + '</p>' : '') + '</article>';
        }

        pageContent.innerHTML = [
          '<div class="welcome"><h1>Payment review</h1><p>Check the transaction reference and proof before approving. Approval activates the course subscription automatically.</p></div>',
          '<div class="section-head"><h2>Awaiting review (' + pending.length + ')</h2></div>',
          pending.length ? '<div class="grid">' + pending.map(payment => paymentCard(payment, true)).join("") + '</div>' : '<div class="empty">There are no pending payments.</div>',
          '<div class="section-head"><h2>Previously reviewed</h2></div>',
          reviewed.length ? '<div class="grid">' + reviewed.map(payment => paymentCard(payment, false)).join("") + '</div>' : '<div class="empty">No payments have been reviewed yet.</div>'
        ].join("");

        pageContent.querySelectorAll("[data-open-proof]").forEach(button => {
          button.addEventListener("click", () => {
            if (button.dataset.openProof) openPaymentProof(button.dataset.openProof);
            else showAlert("No proof file was attached to this payment.");
          });
        });

        pageContent.querySelectorAll("[data-review-payment]").forEach(button => {
          button.addEventListener("click", async () => {
            const decision = button.dataset.decision;
            const paymentId = button.dataset.reviewPayment;
            const confirmed = confirm(decision === "verified"
              ? "Confirm that you checked the payment and want to approve it? This will activate course access."
              : "Are you sure you want to reject this payment?");
            if (!confirmed) return;

            const notes = prompt(
              decision === "rejected"
                ? "Please give the student a reason for rejection:"
                : "Optional note for the student:",
              ""
            );
            if (notes === null) return;
            if (decision === "rejected" && !notes.trim()) {
              showAlert("Please enter a short reason before rejecting this payment.");
              return;
            }

            const card = button.closest(".card");
            const reviewButtons = card ? Array.from(card.querySelectorAll("[data-review-payment]")) : [button];
            reviewButtons.forEach(action => {
              action.disabled = true;
              action.dataset.originalLabel = action.textContent;
            });
            button.textContent = decision === "verified" ? "Approving…" : "Rejecting…";

            try {
              const result = await supabaseClient.rpc("admin_review_manual_payment", {
                p_payment_id: paymentId,
                p_decision: decision,
                p_notes: notes.trim()
              });
              if (result.error) throw result.error;
              showAlert(decision === "verified"
                ? "Payment verified. The course subscription is now active."
                : "Payment rejected and the student has been given a reason.", "success");
              await renderAdminPayments();
            } catch (error) {
              showAlert(error.message || "The payment could not be reviewed.");
              reviewButtons.forEach(action => {
                action.disabled = false;
                action.textContent = action.dataset.originalLabel || action.textContent;
              });
            }
          });
        });
      }


      const resourceTypeLabels = {
        lecture_note: "Additional material",
        tutorial_sheet: "Tutorial sheet",
        past_paper: "Past examination paper",
        solution: "Worked solutions / marking guides",
        other: "Other tutorial material"
      };

      async function renderAdminResources() {
        const [courseResult, moduleResult, resourceResult] = await Promise.all([
          supabaseClient.from("courses").select("id,title").order("title"),
          supabaseClient.from("modules").select("id,course_id,title,position").order("position"),
          supabaseClient.from("course_resources")
            .select("id,course_id,module_id,title,resource_type,description,academic_year,resource_path,original_file_name,file_size_bytes,is_published,created_at,courses(title),modules(title)")
            .order("created_at", { ascending: false })
        ]);
        if (courseResult.error) throw courseResult.error;
        if (moduleResult.error) throw moduleResult.error;
        if (resourceResult.error) throw resourceResult.error;

        const courses = courseResult.data || [];
        const modules = moduleResult.data || [];
        const resources = resourceResult.data || [];
        const options = courses.map(course =>
          '<option value="' + escapeHTML(course.id) + '">' + escapeHTML(course.title) + '</option>'
        ).join("");
        const moduleOptions = modules.map(module =>
          '<option value="' + escapeHTML(module.id) + '" data-course="' + escapeHTML(module.course_id) + '">' +
          escapeHTML(module.title) + '</option>'
        ).join("");

        pageContent.innerHTML = [
          '<div class="welcome"><h1>Course tutorial materials</h1><p>Upload tutorial sheets, past examination papers, worked solutions and practice materials. Files stay private until you publish them to students with an active subscription.</p></div>',
          '<div class="card"><div class="section-head" style="margin-top:0"><h2>Upload tutorial material</h2></div>',
          '<form class="form" id="resourceUploadForm" style="max-width:720px">',
          '<label>Course<select name="course_id" id="resourceCourse" required><option value="">Choose a course</option>' + options + '</select></label>',
          '<label>Module / topic (optional)<select name="module_id" id="resourceModule"><option value="">General course material</option>' + moduleOptions + '</select></label>',
          '<label>Resource title<input name="title" required maxlength="180" placeholder="e.g. Tutorial Sheet 1 — Introduction to Calculus"></label>',
          '<label>Tutorial material type<select name="resource_type" required><option value="tutorial_sheet">Tutorial sheet</option><option value="past_paper">Past examination paper</option><option value="solution">Worked solutions / marking guides</option><option value="other">Other tutorial material</option></select></label>',
          '<label>Year (optional, useful for past papers)<input name="academic_year" type="number" min="1900" max="2100" placeholder="e.g. 2024"></label>',
          '<label>Description (optional)<textarea name="description" rows="3" maxlength="1000" placeholder="Briefly describe what students will find in this file"></textarea></label>',
          '<label>Choose file (PDF, Word, PowerPoint, JPG or PNG; maximum 20 MB)<input name="resource_file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,image/jpeg,image/png" required></label>',
          '<label style="display:flex;align-items:center;gap:9px"><input type="checkbox" name="publish_now" style="width:auto;margin:0"> Make available to subscribed students immediately</label>',
          '<div class="inline-actions"><button class="btn" type="submit" id="resourceUploadBtn">Upload tutorial material</button></div>',
          '<p class="muted" style="font-size:12px;margin:0">If you leave the publish box unticked, the file is saved as a draft and only administrators can see it.</p>',
          '</form></div>',
          '<div class="section-head"><h2>Uploaded tutorial materials (' + resources.length + ')</h2></div>',
          resources.length ? '<div class="card"><div style="padding:16px 16px 0"><label for="resourceSearch" class="muted">Find a tutorial material</label><input id="resourceSearch" type="search" placeholder="Search by title, course, topic or file name" style="width:100%;max-width:460px"></div><div class="table-wrap"><table class="table"><thead><tr><th>Tutorial material</th><th>Course / topic</th><th>Category</th><th>Visibility</th><th>Actions</th></tr></thead><tbody>' +
            resources.map(resource => '<tr data-resource-row data-search="' + escapeHTML([resource.title, resource.original_file_name, resource.courses?.title, resource.modules?.title, resourceTypeLabels[resource.resource_type] || resource.resource_type].filter(Boolean).join(" ").toLowerCase()) + '"><td><strong>' + escapeHTML(resource.title) + '</strong><div class="muted">' + escapeHTML(resource.original_file_name) + '</div>' +
              (resource.academic_year ? '<div class="muted">Year: ' + resource.academic_year + '</div>' : '') + '</td>' +
              '<td>' + escapeHTML(resource.courses?.title || "Course") + '<div class="muted">' + escapeHTML(resource.modules?.title || "General resource") + '</div></td>' +
              '<td>' + escapeHTML(resourceTypeLabels[resource.resource_type] || resource.resource_type) + '</td>' +
              '<td><span class="pill" style="' + (resource.is_published ? '' : 'background:#F0F4F8;color:#627D98') + '">' + (resource.is_published ? 'Published' : 'Draft') + '</span></td>' +
              '<td><div class="inline-actions"><button class="btn secondary" type="button" data-resource-open="' + escapeHTML(resource.resource_path) + '">View file</button>' +
              '<button class="btn secondary" type="button" data-resource-toggle="' + escapeHTML(resource.id) + '" data-published="' + resource.is_published + '">' + (resource.is_published ? 'Unpublish' : 'Publish') + '</button>' +
              '<button class="btn danger" type="button" data-resource-delete="' + escapeHTML(resource.id) + '" data-path="' + escapeHTML(resource.resource_path) + '">Delete</button></div></td></tr>'
            ).join("") + '</tbody></table></div></div>' : '<div class="empty">No tutorial materials have been uploaded yet. Add your first tutorial sheet, past paper or worked solution here.</div>'
        ].join("");

        const resourceSearch = document.getElementById("resourceSearch");
        if (resourceSearch) {
          resourceSearch.addEventListener("input", () => {
            const query = resourceSearch.value.trim().toLowerCase();
            pageContent.querySelectorAll("[data-resource-row]").forEach(row => {
              row.hidden = !row.dataset.search.includes(query);
            });
          });
        }

        const moduleSelect = document.getElementById("resourceModule");
        const courseSelect = document.getElementById("resourceCourse");
        courseSelect.addEventListener("change", () => {
          Array.from(moduleSelect.options).forEach(option => {
            if (!option.value) return;
            option.hidden = option.dataset.course !== courseSelect.value;
            if (option.hidden && option.selected) moduleSelect.value = "";
          });
        });

        document.getElementById("resourceUploadForm").addEventListener("submit", async event => {
          event.preventDefault();
          const form = event.currentTarget;
          const values = new FormData(form);
          const file = values.get("resource_file");
          const allowed = [
            "application/pdf", "application/msword",
            "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            "application/vnd.ms-powerpoint",
            "application/vnd.openxmlformats-officedocument.presentationml.presentation",
            "image/jpeg", "image/png"
          ];
          if (!(file instanceof File) || !file.size || file.size > 20971520 || !allowed.includes(file.type)) {
            showAlert("Choose a supported PDF, Word, PowerPoint, JPG or PNG file no larger than 20 MB.");
            return;
          }
          const courseId = values.get("course_id");
          const selectedModule = values.get("module_id") || null;
          const moduleRecord = modules.find(item => item.id === selectedModule);
          if (moduleRecord && moduleRecord.course_id !== courseId) {
            showAlert("Choose a topic belonging to the selected course.");
            return;
          }
          const yearText = String(values.get("academic_year") || "").trim();
          const year = yearText ? Number(yearText) : null;
          if (year !== null && (!Number.isInteger(year) || year < 1900 || year > 2100)) {
            showAlert("Enter a valid year.");
            return;
          }

          const button = document.getElementById("resourceUploadBtn");
          button.disabled = true;
          button.textContent = "Uploading file…";
          let uploadedPath = null;
          try {
            const extension = (file.name.split(".").pop() || "file").toLowerCase().replace(/[^a-z0-9]/g, "");
            uploadedPath = courseId + "/" + crypto.randomUUID() + "." + (extension || "file");
            const upload = await supabaseClient.storage.from("course-resources")
              .upload(uploadedPath, file, { upsert: false, contentType: file.type });
            if (upload.error) throw upload.error;

            button.textContent = "Saving resource details…";
            const insert = await supabaseClient.from("course_resources").insert({
              course_id: courseId,
              module_id: selectedModule,
              title: String(values.get("title") || "").trim(),
              resource_type: values.get("resource_type"),
              description: String(values.get("description") || "").trim() || null,
              academic_year: year,
              resource_path: uploadedPath,
              original_file_name: file.name,
              mime_type: file.type,
              file_size_bytes: file.size,
              is_published: values.get("publish_now") === "on",
              uploaded_by: currentUser.id
            });
            if (insert.error) throw insert.error;
            showAlert("Tutorial material uploaded successfully.", "success");
            form.reset();
          } catch (error) {
            if (uploadedPath) {
              await supabaseClient.storage.from("course-resources").remove([uploadedPath]);
            }
            showAlert(error.message || "The tutorial material could not be uploaded.");
            button.disabled = false;
            button.textContent = "Upload tutorial material";
            return;
          }
          await renderAdminResources();
        });

        pageContent.querySelectorAll("[data-resource-open]").forEach(button => {
          button.addEventListener("click", () => openCourseResource(button.dataset.resourceOpen));
        });
        pageContent.querySelectorAll("[data-resource-toggle]").forEach(button => {
          button.addEventListener("click", async () => {
            const publish = button.dataset.published !== "true";
            button.disabled = true;
            const result = await supabaseClient.from("course_resources")
              .update({ is_published: publish }).eq("id", button.dataset.resourceToggle);
            if (result.error) {
              showAlert(result.error.message || "Could not update resource visibility.");
              button.disabled = false;
              return;
            }
            showAlert(publish ? "Tutorial material published for subscribed students." : "Tutorial material unpublished.", "success");
            await renderAdminResources();
          });
        });
        pageContent.querySelectorAll("[data-resource-delete]").forEach(button => {
          button.addEventListener("click", async () => {
            if (!confirm("Delete this tutorial material and its uploaded file? This cannot be undone.")) return;
            button.disabled = true;
            const removeRow = await supabaseClient.from("course_resources")
              .delete().eq("id", button.dataset.resourceDelete);
            if (removeRow.error) {
              showAlert(removeRow.error.message || "Could not delete the resource.");
              button.disabled = false;
              return;
            }
            const removeFile = await supabaseClient.storage.from("course-resources")
              .remove([button.dataset.path]);
            if (removeFile.error) showAlert("Tutorial material record deleted, but its stored file could not be removed: " + removeFile.error.message);
            else showAlert("Tutorial material and file deleted.", "success");
            await renderAdminResources();
          });
        });
      }

      async function openCourseResource(path) {
        const result = await supabaseClient.storage.from("course-resources")
          .createSignedUrl(path, 300);
        if (result.error) {
          showAlert(result.error.message || "The resource file could not be opened.");
          return;
        }
        window.open(result.data.signedUrl, "_blank", "noopener,noreferrer");
      }

      async function renderStudentCourseResources(courseId, courseTitle) {
        setLoading("Loading tutorial materials…");
        const result = await supabaseClient.from("course_resources")
          .select("id,title,resource_type,description,academic_year,resource_path,original_file_name,created_at,modules(title)")
          .eq("course_id", courseId)
          .eq("is_published", true)
          .order("created_at", { ascending: false });
        if (result.error) throw result.error;
        const resources = result.data || [];
        pageTitle.textContent = courseTitle || "Tutorial materials";
        pageContent.innerHTML = [
          '<div class="welcome"><h1>' + escapeHTML(courseTitle || "Tutorial materials") + '</h1><p>Tutorial materials available with your active subscription.</p></div>',
          '<div class="inline-actions" style="margin-bottom:16px"><button class="btn secondary" type="button" id="backToCourses">← Back to my courses</button></div>',
          resources.length ? '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">' +
            resources.map(resource => '<article class="card"><span class="pill">' + escapeHTML(resourceTypeLabels[resource.resource_type] || resource.resource_type) + '</span>' +
              '<h3 style="color:var(--navy);margin:12px 0 6px">' + escapeHTML(resource.title) + '</h3>' +
              '<p class="muted" style="font-size:12px">' + escapeHTML(resource.modules?.title || "General course resource") +
              (resource.academic_year ? ' · ' + resource.academic_year : '') + '</p>' +
              (resource.description ? '<p style="font-size:13px">' + escapeHTML(resource.description) + '</p>' : '') +
              '<p class="muted" style="font-size:11px;overflow-wrap:anywhere">' + escapeHTML(resource.original_file_name) + '</p>' +
              '<button class="btn" type="button" data-student-resource="' + escapeHTML(resource.resource_path) + '">Open / download</button></article>'
            ).join("") + '</div>' : '<div class="empty">No tutorial materials have been published for this course yet. Please check again later.</div>'
        ].join("");
        document.getElementById("backToCourses").addEventListener("click", () => renderPage("courses"));
        pageContent.querySelectorAll("[data-student-resource]").forEach(button => {
          button.addEventListener("click", () => openCourseResource(button.dataset.studentResource));
        });
      }

      function renderProfile() {

        pageContent.innerHTML = `
          <div class="welcome">
            <h1>My profile</h1>
            <p>Your Bright Minds account information.</p>
          </div>

          <div class="card" style="max-width:650px">

            <div class="form">

              <label>
                Full name
                <input
                  value="${escapeHTML(currentProfile.full_name || "")}"
                  disabled>
              </label>

              <label>
                Email address
                <input
                  value="${escapeHTML(currentUser.email || "")}"
                  disabled>
              </label>

              <label>
                Account role
                <input
                  value="${escapeHTML(currentProfile.role || "student")}"
                  disabled>
              </label>

            </div>

            <p class="muted" style="font-size:12px;margin-top:18px">
              To update your account details, contact
              brightmindstutorials@gmail.com.
            </p>

          </div>
        `;
      }

      function renderPlaceholder(message) {

        pageContent.innerHTML = `
          <div class="welcome">
            <h1>${escapeHTML(titles[currentPage])}</h1>
          </div>

          <div class="empty">
            ${escapeHTML(message)}
          </div>
        `;
      }

      document
        .getElementById("mainNav")
        .addEventListener("click", event => {

          const button = event.target.closest("button[data-page]");

          if (button) {
            renderPage(button.dataset.page);
            closeMobileMenu();
          }
        });

      document
        .getElementById("adminNav")
        .addEventListener("click", event => {

          const button = event.target.closest("button[data-page]");

          if (button) {
            renderPage(button.dataset.page);
          }
        });

      const sidebar = document.getElementById("sidebar");
      const menuToggle = document.getElementById("menuToggle");
      const sidebarBackdrop = document.getElementById("sidebarBackdrop");

      function closeMobileMenu() {
        sidebar.classList.remove("open");
        sidebarBackdrop.classList.remove("open");
        menuToggle.setAttribute("aria-expanded", "false");
        menuToggle.setAttribute("aria-label", "Open navigation");
        document.body.style.overflow = "";
      }

      function toggleMobileMenu() {
        const isOpen = sidebar.classList.toggle("open");
        sidebarBackdrop.classList.toggle("open", isOpen);
        menuToggle.setAttribute("aria-expanded", String(isOpen));
        menuToggle.setAttribute("aria-label", isOpen ? "Close navigation" : "Open navigation");
        document.body.style.overflow = isOpen ? "hidden" : "";
      }

      menuToggle.addEventListener("click", toggleMobileMenu);
      sidebarBackdrop.addEventListener("click", closeMobileMenu);
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeMobileMenu();
      });

      window.addEventListener("resize", () => {
        if (window.innerWidth > 900) closeMobileMenu();
      });

      document
        .getElementById("signOutBtn")
        .addEventListener("click", async () => {

          if (!supabaseClient) return;

          const { error } = await supabaseClient.auth.signOut();

          if (error) {
            showAlert(error.message);
            return;
          }

          window.location.replace("./index.html");
        });

      init().catch(error => {
        pageContent.innerHTML = `
          <div class="empty">
            The dashboard could not be started.
          </div>
        `;

        showAlert(error.message || "An unexpected error occurred.");
      });

    })();
  </script>

</body>
</html>
