<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102A43">
  <title>Dashboard | Bright Minds Tutorials</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">

  <style>
    :root {
      --navy: #102A43;
      --teal: #00B8A9;
      --ink: #243B53;
      --muted: #627D98;
      --bg: #F4F7FA;
      --white: #FFFFFF;
      --border: #D9E2EC;
      --danger: #C0392B;
      --shadow: 0 12px 30px rgba(16,42,67,.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .app { min-height: 100vh; }

    :focus-visible {
      outline: 3px solid rgba(0,184,169,.55);
      outline-offset: 3px;
    }

    .card {
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #C5D5E4;
      box-shadow: 0 16px 34px rgba(16,42,67,.11);
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 250px;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      background: var(--navy);
      color: white;
      padding: 26px 18px;
      display: flex;
      flex-direction: column;
      z-index: 20;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(188,204,220,.42) transparent;
      scroll-behavior: smooth;
    }

    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(188,204,220,.35);
      border-radius: 99px;
    }
    .sidebar::-webkit-scrollbar-thumb:hover {
      background: rgba(188,204,220,.6);
    }

    .sidebar .brand,
    .sidebar .nav-label,
    .sidebar .nav,
    .sidebar .sidebar-bottom {
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 28px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: white;
      color: var(--navy);
      display: grid;
      place-items: center;
      font: 800 24px "Manrope", sans-serif;
      position: relative;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--teal);
      right: 5px;
      top: 5px;
    }

    .brand-name {
      font: 800 16px "Manrope", sans-serif;
      line-height: 1.2;
    }

    .brand-name span { color: var(--teal); }

    .brand-sub {
      color: #BCCCDC;
      font-size: 10px;
      margin-top: 4px;
    }

    .nav-label {
      color: #9FB3C8;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      padding: 18px 12px 9px;
    }

    .nav { display: grid; gap: 6px; }

    .nav button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #D9E2EC;
      text-align: left;
      border-radius: 10px;
      padding: 12px 13px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-weight: 600;
      font-size: 14px;
    }

    .nav button:hover,
    .nav button.active {
      background: rgba(255,255,255,.12);
      color: white;
    }

    .nav button.active {
      box-shadow: inset 3px 0 var(--teal);
    }

    .nav-icon {
      width: 19px;
      text-align: center;
      color: #7FE3DA;
    }

    .sidebar-bottom {
      margin-top: auto;
      border-top: 1px solid rgba(255,255,255,.15);
      padding: 18px 8px 0;
      color: #BCCCDC;
      font-size: 12px;
    }

    .main {
      margin-left: 250px;
      min-height: 100vh;
    }

    .topbar {
      min-height: 76px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 34px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .page-title {
      font: 800 20px "Manrope", sans-serif;
      color: var(--navy);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #D9F7F4;
      color: var(--navy);
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .user-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
    }

    .user-role {
      font-size: 11px;
      color: var(--muted);
      text-transform: capitalize;
      margin-top: 2px;
    }

    .content {
      padding: 30px 34px 50px;
      max-width: 1400px;
      margin: auto;
    }

    .welcome { margin-bottom: 25px; }

    .welcome h1 {
      margin: 0 0 7px;
      font: 800 26px "Manrope", sans-serif;
      color: var(--navy);
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
    }

    .grid { display: grid; gap: 18px; }

    .stats {
      grid-template-columns: repeat(3, minmax(0,1fr));
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 21px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .stat-value {
      color: var(--navy);
      font: 800 28px "Manrope", sans-serif;
      margin-top: 10px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 26px 0 14px;
    }

    .section-head h2 {
      margin: 0;
      color: var(--navy);
      font: 800 18px "Manrope", sans-serif;
    }

    .muted { color: var(--muted); }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 10px 15px;
      font-weight: 700;
      background: var(--teal);
      color: white;
    }

    .btn:hover { filter: brightness(.95); }

    .btn.secondary {
      background: #E6FFFB;
      color: #087F78;
    }

    .btn.danger {
      background: #FDECEC;
      color: var(--danger);
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .table-wrap { overflow-x: auto; }

    .table {
      width: 100%;
      border-collapse: collapse;
      min-width: 560px;
    }

    .table th, .table td {
      padding: 13px 12px;
      border-bottom: 1px solid #EAF0F5;
      text-align: left;
      font-size: 13px;
    }

    .table th {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .pill {
      display: inline-block;
      border-radius: 30px;
      padding: 5px 9px;
      background: #E6FFFB;
      color: #087F78;
      font-size: 11px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .empty {
      padding: 30px 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    .alert {
      padding: 13px 15px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 13px;
      display: none;
    }

    .alert.error {
      display: block;
      background: #FFF1F0;
      color: #9B2C2C;
      border: 1px solid #FED7D7;
    }

    .alert.success {
      display: block;
      background: #E6FFFB;
      color: #087F78;
      border: 1px solid #B2F5EA;
    }

    .loading {
      padding: 25px;
      color: var(--muted);
      text-align: center;
    }
    
    .upload-progress { width:100%; height:10px; margin-top:10px; border:0; border-radius:99px; overflow:hidden; background:#EAF0F5; accent-color:var(--teal); }
    .upload-progress::-webkit-progress-bar { background:#EAF0F5; border-radius:99px; }
    .upload-progress::-webkit-progress-value { background:var(--teal); border-radius:99px; transition:width .15s ease; }
    .upload-progress::-moz-progress-bar { background:var(--teal); border-radius:99px; }

    .mobile-menu {
      display: none;
      border: 0;
      background: #E6FFFB;
      color: var(--navy);
      border-radius: 8px;
      padding: 9px 12px;
    }

    .hidden { display: none !important; }

    .form {
      display: grid;
      gap: 12px;
      max-width: 520px;
    }

    .form label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .form input,
    .form select,
    .form textarea {
      width: 100%;
      margin-top: 6px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--ink);
      background: white;
    }

    .inline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .payment-method-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .payment-method-card {
      min-width: 0;
      padding: 15px;
      background: #F4F7FA;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .payment-number {
      display: block;
      margin: 6px 0 3px;
      color: var(--navy);
      font: 800 21px "Manrope", sans-serif;
      letter-spacing: .2px;
    }

    .payment-steps {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .payment-step {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 11px;
      background: #F8FAFC;
      border: 1px solid #EAF0F5;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.55;
    }

    .payment-step-number {
      flex: 0 0 25px;
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #D9F7F4;
      color: #087F78;
      font-weight: 800;
      font-size: 12px;
    }

    .payment-whatsapp-links {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .payment-whatsapp-links a {
      display: block;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--navy);
      background: white;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .payment-whatsapp-links a:hover {
      border-color: var(--teal);
      background: #F2FFFD;
    }

    #manualPaymentForm { max-width: 100%; }
    #manualPaymentForm select,
    #manualPaymentForm input:not([type="checkbox"]) { min-height: 46px; }
    #manualPaymentForm [data-course-choice] { flex: 0 0 18px; }
    #manualPaymentForm label:has([data-course-choice]) {
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }
    #manualPaymentForm label:has([data-course-choice]):hover {
      border-color: #9ADFD8 !important;
      background: #F8FFFE;
    }

    @media(max-width:620px) {
      .payment-method-grid { grid-template-columns: 1fr; }
      .payment-number { font-size: 20px; }
      .payment-step { padding: 10px; }
      #manualPaymentForm .btn { width: 100%; min-height: 48px; }
    }

    @media(max-width:900px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform .24s ease;
        box-shadow: 18px 0 40px rgba(16,42,67,.18);
      }

      .sidebar.open { transform: translateX(0); }

      .sidebar-backdrop {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 15;
        border: 0;
        padding: 0;
        background: rgba(10,25,41,.42);
        opacity: 0;
        visibility: hidden;
        transition: opacity .2s ease, visibility .2s ease;
      }

      .sidebar-backdrop.open {
        opacity: 1;
        visibility: visible;
      }
      .main { margin-left: 0; }
      .mobile-menu { display: inline-block; }
      .topbar { padding: 13px 18px; }
      .content { padding: 24px 18px 40px; }
    }

    @media(max-width:620px) {
      .stats { grid-template-columns: 1fr; }
      .user-details { display: none; }
      .welcome h1 { font-size: 22px; }
      .content { padding: 20px 14px 35px; }
      .topbar { padding: 12px 14px; }
    }
  </style>
</head>

<body>
  <div class="app">

    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <div class="brand-mark">B</div>
        <div>
          <div class="brand-name">Bright <span>Minds</span></div>
          <div class="brand-sub">TUTORIALS · LEARN. UNDERSTAND. EXCEL.</div>
        </div>
      </div>

      <div class="nav-label">WORKSPACE</div>

      <nav class="nav" id="mainNav">
        <button class="active" data-page="overview">
          <span class="nav-icon">⌂</span>Overview
        </button>

        <button data-page="courses">
          <span class="nav-icon">▣</span>My courses
        </button>

        <button data-page="payments">
          <span class="nav-icon">₵</span>Subscribe &amp; payments
        </button>

        <button data-page="assessments">
          <span class="nav-icon">✓</span>Assessments
        </button>

        <button data-page="announcements">
          <span class="nav-icon">◉</span>Announcements
        </button>

        <button data-page="profile">
          <span class="nav-icon">○</span>My profile
        </button>
      </nav>

      <div class="nav-label hidden" id="adminLabel">
        ADMINISTRATION
      </div>

      <nav class="nav hidden" id="adminNav">
        <button data-page="manage-courses">
          <span class="nav-icon">▤</span>Manage courses
        </button>

        <button data-page="manage-resources">
          <span class="nav-icon">⇧</span>Tutorial materials
        </button>

        <button data-page="assessments">
          <span class="nav-icon">✓</span>Assessments & results
        </button>

        <button data-page="manage-announcements">
          <span class="nav-icon">✎</span>Manage announcements
        </button>

        <button data-page="payments">
          <span class="nav-icon">₵</span>Review payments
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div>Bright Minds Tutorials</div>
        <div style="margin-top:5px">Learn. Understand. Excel.</div>
      </div>

    </aside>

    <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Close navigation" tabindex="-1"></button>

    <main class="main">

      <header class="topbar">

        <div style="display:flex;align-items:center;gap:12px">
          <button class="mobile-menu" id="menuToggle" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
          <div class="page-title" id="pageTitle">Overview</div>
        </div>

        <div class="top-right">

          <div class="user">
            <div class="avatar" id="userAvatar">B</div>

            <div class="user-details">
              <div class="user-name" id="userName">Loading…</div>
              <div class="user-role" id="userRole">Student</div>
            </div>
          </div>

          <button class="btn secondary" id="signOutBtn">
            Sign out
          </button>

        </div>

      </header>

      <section class="content">

        <div id="alertBox" class="alert"></div>

        <div id="pageContent">
          <div class="loading">Loading your Bright Minds dashboard…</div>
        </div>

      </section>

    </main>

  </div>

  
  <script src="./supabase-config.js?v=20261121-1"></script>

  <script>
    (() => {
      "use strict";

      const config = window.BRIGHT_MINDS_CONFIG || {};

      const supabaseUrl = config.SUPABASE_URL;
      const supabaseKey = config.SUPABASE_KEY;

      const pageContent = document.getElementById("pageContent");
      const alertBox = document.getElementById("alertBox");
      const pageTitle = document.getElementById("pageTitle");

      let supabaseLibraryPromise = null;

      function loadSupabaseLibrary() {
        if (window.supabase && window.supabase.createClient) return Promise.resolve();
        if (!supabaseLibraryPromise) {
          supabaseLibraryPromise = new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
            script.async = true;
            script.onload = () => window.supabase && window.supabase.createClient
              ? resolve()
              : reject(new Error("The Supabase client library could not be initialized."));
            script.onerror = () => reject(new Error("The Supabase client library could not be loaded. Check your connection and try again."));
            document.head.appendChild(script);
          }).catch(error => {
            supabaseLibraryPromise = null;
            throw error;
          });
        }
        return supabaseLibraryPromise;
      }

      let supabaseClient = null;
      let currentUser = null;
      let currentProfile = null;
      let currentPage = "overview";

      const titles = {
        overview: "Overview",
        courses: "My courses",
        assessments: "Assessments",
        announcements: "Announcements",
        profile: "My profile",
        "manage-courses": "Manage courses",
        "manage-resources": "Tutorial materials",
        "manage-announcements": "Manage announcements",
        payments: "Payments"
      };

      function showAlert(message, type = "error") {
        alertBox.textContent = message;
        alertBox.className = "alert " + type;
      }

      function clearAlert() {
        alertBox.textContent = "";
        alertBox.className = "alert";
      }

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char]));
      }

      function initials(name) {
        return String(name || "Bright Minds")
          .trim()
          .split(/\s+/)
          .slice(0, 2)
          .map(part => part[0] || "")
          .join("")
          .toUpperCase();
      }

      let tusClientLoadPromise = null;

      function loadTusClient() {
        if (window.tus && window.tus.Upload) return Promise.resolve();
        if (!tusClientLoadPromise) {
          tusClientLoadPromise = new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = "https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js";
            script.async = true;
            script.onload = () => window.tus && window.tus.Upload
              ? resolve()
              : reject(new Error("The resumable upload service could not be initialized."));
            script.onerror = () => reject(new Error("The resumable upload service did not load. Check your connection and try again."));
            document.head.appendChild(script);
          }).catch(error => {
            tusClientLoadPromise = null;
            throw error;
          });
        }
        return tusClientLoadPromise;
      }

      function setLoading(message = "Loading…") {
        pageContent.innerHTML =
          `<div class="loading">${escapeHTML(message)}</div>`;
      }

      function isAdmin() {
        return currentProfile && currentProfile.role === "admin";
      }

      async function init() {

        if (!supabaseUrl || !supabaseKey) {
          const reason = !window.supabase
            ? "The Supabase client library did not load. Check your internet connection or try again."
            : "The Supabase project settings did not load. Refresh the page to fetch the latest configuration.";
          pageContent.innerHTML = `
            <div class="empty">
              <strong>Unable to connect to Bright Minds.</strong>
              <p>${escapeHTML(reason)}</p>
              <button class="btn btn-primary" type="button" onclick="window.location.reload()">Try again</button>
            </div>`;
          return;
        }

        try {
          await loadSupabaseLibrary();
        } catch (error) {
          pageContent.innerHTML = `<div class="empty"><strong>Unable to connect to Bright Minds.</strong><p>${escapeHTML(error.message)}</p><button class="btn" type="button" onclick="window.location.reload()">Try again</button></div>`;
          return;
        }

        supabaseClient = window.supabase.createClient(
          supabaseUrl,
          supabaseKey
        );

        const {
          data: { session },
          error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError) {
          showAlert(sessionError.message);
          return;
        }

        if (!session) {
          window.location.replace("./login.html");
          return;
        }

        currentUser = session.user;

        const { data: profile, error: profileError } =
          await supabaseClient
            .from("profiles")
            .select("full_name, role")
            .eq("id", currentUser.id)
            .single();

        if (profileError || !profile) {
          pageContent.innerHTML = `
            <div class="empty">
              We could not load your account profile.
              Please contact Bright Minds support.
            </div>`;

          showAlert(
            profileError
              ? profileError.message
              : "Your profile record was not found."
          );

          return;
        }

        currentProfile = profile;

        document.getElementById("userName").textContent =
          profile.full_name || currentUser.email || "Bright Minds user";

        document.getElementById("userRole").textContent =
          profile.role || "student";

        document.getElementById("userAvatar").textContent =
          initials(profile.full_name || currentUser.email);

        if (isAdmin()) {
          document.getElementById("adminLabel")
            .classList.remove("hidden");

          document.getElementById("adminNav")
            .classList.remove("hidden");
        }

        await renderPage("overview");
      }

      async function renderPage(page) {

        if (!titles[page]) return;

        if (page.startsWith("manage-") && !isAdmin()) {
          showAlert("You do not have permission to open that page.");
          return;
        }

        currentPage = page;
        pageTitle.textContent = page === "payments" && !isAdmin() ? "Subscribe & payments" : titles[page];

        document.querySelectorAll("#mainNav button, #adminNav button")
          .forEach(button => {
            button.classList.toggle(
              "active",
              button.dataset.page === page
            );
          });

        document.getElementById("sidebar")
          .classList.remove("open");

        clearAlert();
        setLoading();

        try {

          if (page === "overview") {

      async function getMySubscriptions() {

        const { data, error } = await supabaseClient
          .from("subscriptions")
          .select(`
            id,
            course_id,
            status,
            start_date,
            end_date,
            courses (
              id,
              title,
              description,
              subject
            )
          `)
          .eq("student_id", currentUser.id)
          .eq("status", "active");

        if (error) throw error;

        const now = Date.now();

        return (data || []).filter(item =>
          (!item.start_date || new Date(item.start_date).getTime() <= now) &&
          (!item.end_date || new Date(item.end_date).getTime() >= now)
        );
      }

      async function showPriceForm(courseId, courseTitle) {
        const host = document.getElementById("priceFormHost");
        const result = await supabaseClient
          .from("course_subscription_prices")
          .select("id,duration_months,price,currency,is_available")
          .eq("course_id", courseId)
          .order("duration_months");
        if (result.error) {
          showAlert(result.error.message || "Could not load subscription prices.");
          return;
        }

        host.innerHTML = '<div style="border-top:1px solid var(--border);padding-top:18px;margin-top:18px">' +
          '<h3 style="color:var(--navy);margin:0 0 12px">Subscription prices · ' + escapeHTML(courseTitle) + '</h3>' +
          '<form class="form" id="priceForm"><label>Subscription period<select name="duration_months" required><option value="1">1 month</option></select></label>' +
          '<label>Price (ZMW)<input name="price" type="number" min="0.01" step="0.01" required placeholder="e.g. 150.00"></label>' +
          '<div class="inline-actions"><button class="btn" type="submit">Save price</button><button class="btn secondary" type="button" id="closePriceForm">Close</button></div></form>' +
          '<div style="margin-top:16px">' +
          (result.data && result.data.length ? result.data.map(price =>
            '<div class="inline-actions" style="justify-content:space-between;border-bottom:1px solid #EAF0F5;padding:10px 0"><span>' +
            price.duration_months + ' month(s) · ' + money(price.price) + ' ZMW · ' + (price.is_available ? "Available" : "Hidden") +
            '</span><button class="btn secondary" type="button" data-price-toggle="' + escapeHTML(price.id) + '" data-price-active="' + price.is_available + '">' +
            (price.is_available ? "Hide" : "Make available") + '</button></div>'
          ).join("") : '<div class="empty">No subscription prices have been set for this course.</div>') +
          '</div></div>';

        document.getElementById("closePriceForm").addEventListener("click", () => host.replaceChildren());
        document.getElementById("priceForm").addEventListener("submit", async event => {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          const duration = Number(form.get("duration_months"));
          const price = Number(form.get("price"));
          if (duration !== 1 || !Number.isFinite(price) || price <= 0) {
            showAlert("Enter a valid subscription period and positive price.");
            return;
          }
          try {
            const saved = await supabaseClient.from("course_subscription_prices").insert({
              course_id: courseId, duration_months: duration, price,
              currency: "ZMW", is_available: true
            });
            if (saved.error) throw saved.error;
            showAlert("Subscription price saved.", "success");
            await renderManageCourses();
            await showPriceForm(courseId, courseTitle);
          } catch (error) {
            showAlert(error.message || "Could not save the price. This period may already exist.");
          }
        });
        host.querySelectorAll("[data-price-toggle]").forEach(button => {
          button.addEventListener("click", async () => {
            const update = await supabaseClient.from("course_subscription_prices")
              .update({ is_available: button.dataset.priceActive !== "true" })
              .eq("id", button.dataset.priceToggle);
            if (update.error) {
              showAlert(update.error.message || "Could not update this price.");
              return;
            }
            await renderManageCourses();
            await showPriceForm(courseId, courseTitle);
          });
        });
      }

      function showCourseForm() {

        const host = document.getElementById("courseFormHost");

        host.innerHTML = `
          <form class="form" id="courseForm" style="padding:18px 0 24px">

            <label>
              Course title
              <input name="title" required maxlength="150">
            </label>

            <label>
              Subject

                Cancel

            </div>

        document
          .getElementById("cancelCourse")

        document
          .getElementById("courseForm")

            const payload = {
              title: String(form.get("title") || "").trim(),
              subject: String(form.get("subject") || "").trim() || null,
              description: String(form.get("description") || "").trim() || null,
              is_published: false
            };

            try {

              const { error } = await supabaseClient
                .from("courses")
                .insert(payload);

              if (error) throw error;

              showAlert(
                "Course created as a draft. Add its subscription prices before publishing.",
                "success"
              );

              await renderManageCourses();

            } catch (error) {
              showAlert(error.message || "Could not create the course.");
            }
          });
      }

      async function toggleCourse(id, currentlyPublished) {

        if (!currentlyPublished) {
          const prices = await supabaseClient.from("course_subscription_prices")
            .select("id", { count: "exact", head: true })
            .eq("course_id", id)
            .eq("is_available", true);
          if (prices.error) {
            showAlert(prices.error.message || "Could not check course prices.");
            return;
          }
          if (!prices.count) {
            showAlert("Add at least one available subscription price before publishing this course.");
            return;
          }
        }

        const action = currentlyPublished ? "unpublish" : "publish";

        if (!confirm(`Are you sure you want to ${action} this course?`)) {
          return;
        }

        try {

          const { error } = await supabaseClient
            .from("courses")
            .update({ is_published: !currentlyPublished })
            .eq("id", id);

          if (error) throw error;

          showAlert(
            `Course ${currentlyPublished ? "unpublished" : "published"} successfully.`,
            "success"
          );

          await renderManageCourses();

        } catch (error) {
          showAlert(error.message || "Could not update the course.");
        }
      }

      async function renderStudentPayments() {

            .from("courses")

            .in("title", ["Mathematics", "Physics", "Chemistry", "Biology"])
            .eq("is_published", true),
          supabaseClient
            .from("course_subscription_prices")
            .select("course_id,price,currency,duration_months")
            .eq("duration_months", 1)
            .eq("is_available", true),
          supabaseClient
            .from("subscriptions")
            .select("course_id,status,start_date,end_date")
            .eq("student_id", currentUser.id)
            .eq("status", "active"),
          supabaseClient
            .from("payments")
            .select("id,total_amount,currency,payment_method,status,transaction_reference,created_at,verification_notes,payment_items(course_id,course_title,duration_months)")
            .eq("student_id", currentUser.id)
            .order("created_at", { ascending: false })
        ]);

        if (coursesResult.error) throw coursesResult.error;
        if (pricesResult.error) throw pricesResult.error;

        if (historyResult.error) throw historyResult.error;

        const subscriptions = subscriptionsResult.data || [];
        const pendingCourseIds = new Set();
        (historyResult.data || []).filter(payment => payment.status === "pending")
          .forEach(payment => (payment.payment_items || []).forEach(item => pendingCourseIds.add(item.course_id)));
        const now = Date.now();
        const courses = (coursesResult.data || [])
          .filter(course => priceByCourse.has(course.id))
          .sort((a, b) => allowedOrder.indexOf(a.title) - allowedOrder.indexOf(b.title));
        const subscriptionFor = courseId => subscriptions
          .filter(item => item.course_id === courseId && item.end_date && new Date(item.end_date).getTime() >= now)
          .sort((a, b) => new Date(b.end_date).getTime() - new Date(a.end_date).getTime())[0];

        pageContent.innerHTML = [
          '<div class="welcome"><h1>Subscribe to tutorial courses</h1><p>Choose one or more subjects. The current monthly price is shown beside each course, and you can combine up to four courses in one payment.</p></div>',
          '<div class="card" style="margin-bottom:20px">',
          '<h2 style="margin-top:0;color:var(--navy);font:800 18px Manrope">1. Payment details</h2>',
          '<p class="muted" style="font-size:13px;margin:-4px 0 13px">Pay using either of these official Bright Minds mobile money lines.</p>',

      async function renderAdminPayments() {
        const { data, error } = await supabaseClient
          .from("payments")
          .select("id,student_id,total_amount,currency,payment_method,status,transaction_reference,proof_of_payment_url,verification_notes,created_at,verified_at,profiles!payments_student_id_fkey(full_name),payment_items(id,course_title,price_at_purchase,duration_months)")
          .order("created_at", { ascending: false });

        if (error) throw error;

        const payments = data || [];
        const pending = payments.filter(payment => payment.status === "pending");
        const verified = payments.filter(payment => payment.status === "verified");
        const rejected = payments.filter(payment => payment.status === "rejected");

        const methodLabel = method => method === "mtn"
          ? "MTN MoMo"
          : method === "airtel" ? "Airtel Money" : (method || "Not specified");

        function paymentCard(payment, allowReview) {
          const name = payment.profiles?.full_name || "Student";
          const items = (payment.payment_items || []).map(item =>
            '<li style="padding:5px 0">' + escapeHTML(item.course_title) +
            ' <span class="muted">· ' + money(item.price_at_purchase) +
            ' · ' + (Number(item.duration_months) || 1) + ' month(s)</span></li>'
          ).join("");
          const reference = payment.transaction_reference || "";
          const proofAction = payment.proof_of_payment_url
            ? '<button class="btn secondary" type="button" data-open-proof="' + escapeHTML(payment.proof_of_payment_url) + '">View uploaded proof</button>'
            : '<p class="muted" style="font-size:12px;margin:8px 0">No file was uploaded. Confirm the student&#39;s receipt directly on the official Bright Minds WhatsApp account before approving.</p>';
          const reviewActions = allowReview
            ? '<div class="inline-actions" style="margin-top:14px"><button class="btn" type="button" data-review-payment="' + escapeHTML(payment.id) + '" data-decision="verified">Approve and activate</button><button class="btn danger" type="button" data-review-payment="' + escapeHTML(payment.id) + '" data-decision="rejected">Reject payment</button></div>'
            : '<p class="muted" style="font-size:12px;margin-top:12px">Reviewed ' + (payment.verified_at ? new Date(payment.verified_at).toLocaleString() : "date not recorded") + '</p>';
          return '<article class="card" style="margin-bottom:14px">' +
            '<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><strong>' + escapeHTML(name) + '</strong><span class="pill">' + escapeHTML(payment.status) + '</span></div>' +
            '<h3 style="color:var(--navy);font:800 22px Manrope;margin:12px 0 8px">' + money(payment.total_amount) + ' ' + escapeHTML(payment.currency || "ZMW") + '</h3>' +
            '<div style="font-size:13px;margin:0 0 10px"><strong>Courses selected</strong><ul style="margin:6px 0 0;padding-left:20px">' + (items || '<li>Course details unavailable</li>') + '</ul></div>' +
            '<div style="background:var(--surface, #F5F7FA);border-radius:10px;padding:12px;margin:12px 0">' +
              '<div style="font-size:12px;color:var(--muted);margin-bottom:4px">Transaction reference</div>' +
              '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><strong style="font-size:14px;overflow-wrap:anywhere">' + escapeHTML(reference || "Not provided") + '</strong>' +
              (reference ? '<button class="btn secondary" type="button" data-copy-reference="' + escapeHTML(reference) + '" style="padding:7px 11px">Copy reference</button>' : '') + '</div>' +
            '</div>' +
            '<p class="muted" style="font-size:12px;line-height:1.7;margin:8px 0">Payment method: ' + escapeHTML(methodLabel(payment.payment_method)) +
            '<br>Submitted: ' + new Date(payment.created_at).toLocaleString() +
            '<br>Payment ID: ' + escapeHTML(payment.id) + '</p>' +
            proofAction + reviewActions +
            (payment.verification_notes ? '<p class="muted" style="font-size:12px;margin-top:10px">Review note: ' + escapeHTML(payment.verification_notes) + '</p>' : '') +
            '</article>';
        }

        pageContent.innerHTML = [
          '<div class="welcome"><h1>Payment review</h1><p>Check the exact amount, payment method and transaction reference. Match them with the receipt received through WhatsApp or the uploaded proof before approving. Approval activates or extends the selected course subscriptions.</p></div>',
          '<div class="grid stats" style="margin-bottom:20px">' +
            '<div class="card"><div class="stat-label">Awaiting review</div><div class="stat-value">' + pending.length + '</div></div>' +
            '<div class="card"><div class="stat-label">Verified</div><div class="stat-value">' + verified.length + '</div></div>' +
            '<div class="card"><div class="stat-label">Rejected</div><div class="stat-value">' + rejected.length + '</div></div>' +
          '</div>',
          '<div class="section-head"><h2>Awaiting review (' + pending.length + ')</h2></div>',

          '<div class="section-head"><h2>Previously reviewed (' + (verified.length + rejected.length) + ')</h2></div>',

          rejected.length ? '<h3 style="color:var(--navy);margin:18px 0 12px">Rejected payments (' + rejected.length + ')</h3>' + rejected.map(payment => paymentCard(payment, false)).join("") : '',
          (!verified.length && !rejected.length) ? '<div class="empty">No payments have been reviewed yet.</div>' : ''

            try {
              await navigator.clipboard.writeText(button.dataset.copyReference);

              showAlert("Copy was unavailable in this browser. Please select and copy the reference manually.");
            }
          });

        pageContent.querySelectorAll("[data-review-payment]").forEach(button => {
          button.addEventListener("click", async () => {
            const decision = button.dataset.decision;
            const paymentId = button.dataset.reviewPayment;
            const confirmed = confirm(decision === "verified"
              ? "Only approve after you have independently matched the student's transaction reference and exact amount with the money received. This will activate or extend course access."
              : "Are you sure you want to reject this payment?");

              ""

            if (notes === null) return;
            if (decision === "rejected" && !notes.trim()) {

              return;
            }

            const card = button.closest(".card");
            const reviewButtons = card ? Array.from(card.querySelectorAll("[data-review-payment]")) : [button];
            reviewButtons.forEach(action => {
              action.disabled = true;
              action.dataset.originalLabel = action.textContent;
            });
            button.textContent = decision === "verified" ? "Approving…" : "Rejecting…";

            try {
              const result = await supabaseClient.rpc("admin_review_manual_payment", {
                p_payment_id: paymentId,
                p_decision: decision,
                p_notes: notes.trim()
              });
              if (result.error) throw result.error;

              reviewButtons.forEach(action => {
                action.disabled = false;
                action.textContent = action.dataset.originalLabel || action.textContent;
              });
            }
          });
        });

        document.getElementById("resourceUploadForm").addEventListener("submit", async event => {
          event.preventDefault();
          const form = event.currentTarget;
          const values = new FormData(form);
          const file = values.get("resource_file");
          const allowed = [
            "application/pdf", "application/msword",
            "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            "application/vnd.ms-powerpoint",
            "application/vnd.openxmlformats-officedocument.presentationml.presentation",
            "image/jpeg", "image/png"
          ];
          if (!(file instanceof File) || !file.size || file.size > 20971520 || !allowed.includes(file.type)) {
            showAlert("Choose a supported PDF, Word, PowerPoint, JPG or PNG file no larger than 20 MB.");
            return;
          }
          const courseId = values.get("course_id");
          const selectedModule = values.get("module_id") || null;
          const moduleRecord = modules.find(item => item.id === selectedModule);
          if (moduleRecord && moduleRecord.course_id !== courseId) {
            showAlert("Choose a topic belonging to the selected course.");
            return;
          }
          const yearText = String(values.get("academic_year") || "").trim();
          const year = yearText ? Number(yearText) : null;
          if (year !== null && (!Number.isInteger(year) || year < 1900 || year > 2100)) {
            showAlert("Enter a valid year.");
            return;
          }

          const button = document.getElementById("resourceUploadBtn");
          button.disabled = true;
          button.textContent = "Uploading file…";
          let uploadedPath = null;
          try {
            const extension = (file.name.split(".").pop() || "file").toLowerCase().replace(/[^a-z0-9]/g, "");
            uploadedPath = courseId + "/" + crypto.randomUUID() + "." + (extension || "file");
            const progress = document.getElementById("resourceUploadProgress");
            const status = document.getElementById("resourceUploadStatus");
            progress.hidden = false;
            progress.value = 0;

            if (file.size > 6 * 1024 * 1024) {
              status.textContent = "Preparing the resumable upload service…";
              await loadTusClient();
              status.textContent = "Preparing a resumable upload…";
              const { data: { session } } = await supabaseClient.auth.getSession();
              if (!session?.access_token) throw new Error("Your session has expired. Please sign in again.");
              try {
                await new Promise((resolve, reject) => {
                  const resumable = new window.tus.Upload(file, {
                    endpoint: "https://wdzgkkbhhceogzwuiuji.storage.supabase.co/storage/v1/upload/resumable",
                    retryDelays: [0, 3000, 5000, 10000, 20000],
                    headers: {
                      authorization: "Bearer " + session.access_token,
                      apikey: supabaseKey
                    },
                    uploadDataDuringCreation: true,
                    // Do not reuse a browser-stored upload URL from an earlier
                    // attempt. Every upload has a new object path; stale TUS
                    // sessions can otherwise trigger a failing HEAD request.
                    storeFingerprintForResuming: false,
                    chunkSize: 6 * 1024 * 1024,
                    metadata: {
                      bucketName: "course-resources",
                      objectName: uploadedPath,
                      contentType: file.type,
                      cacheControl: "3600"
                    },
                    onError: reject,
                    onProgress(bytesUploaded, bytesTotal) {
                      const percent = Math.round((bytesUploaded / bytesTotal) * 100);
                      progress.value = percent;
                      status.textContent = "Uploading " + percent + "% · " +
                        (bytesUploaded / 1048576).toFixed(1) + " of " +
                        (bytesTotal / 1048576).toFixed(1) + " MB";
                    },
                    onSuccess: resolve
                  });
                  resumable.start();
                });
              } catch (resumableError) {
                // The accepted maximum is 20 MB, so use the standard Storage
                // upload as a fallback if the TUS protocol/session fails.
                status.textContent = "Resumable upload could not continue. Trying the direct upload…";
                progress.value = 0;
                const directUpload = await supabaseClient.storage.from("course-resources")
                  .upload(uploadedPath, file, {
                    upsert: false,
                    contentType: file.type,
                    cacheControl: "3600"
                  });
                if (directUpload.error) {
                  throw new Error(
                    "Resumable upload failed (" + (resumableError.message || "connection error") +
                    "). Direct upload also failed: " + directUpload.error.message
                  );
                }
              }
            } else {
              status.textContent = "Uploading file…";
              const upload = await supabaseClient.storage.from("course-resources")
                .upload(uploadedPath, file, { upsert: false, contentType: file.type, cacheControl: "3600" });
              if (upload.error) throw upload.error;
              progress.value = 100;
              status.textContent = "Upload complete. Saving details…";
            }

            // Confirm the object exists before saving its database record. A completed
            // TUS callback alone must not leave a published resource pointing at a missing file.
            const pathParts = uploadedPath.split("/");
            const uploadFolder = pathParts.slice(0, -1).join("/");
            const uploadLeaf = pathParts[pathParts.length - 1];
            const checkStoredObject = async () => {
              const listed = await supabaseClient.storage.from("course-resources")
                .list(uploadFolder, { search: uploadLeaf, limit: 10 });
              if (listed.error) throw listed.error;
              return (listed.data || []).some(item => item.name === uploadLeaf);
            };
            let objectConfirmed = await checkStoredObject();
            if (!objectConfirmed) {
              status.textContent = "Verifying uploaded file…";
              await new Promise(resolve => setTimeout(resolve, 1000));
              objectConfirmed = await checkStoredObject();
            }
            if (!objectConfirmed) {
              status.textContent = "Completing file upload…";
              const verifiedFallback = await supabaseClient.storage.from("course-resources")
                .upload(uploadedPath, file, {
                  upsert: true,
                  contentType: file.type,
                  cacheControl: "3600"
                });
              if (verifiedFallback.error) throw verifiedFallback.error;
              objectConfirmed = await checkStoredObject();
            }
            if (!objectConfirmed) {
              throw new Error("The upload finished but the file could not be verified in storage. No document record was created. Please try again.");
            }

            button.textContent = "Saving resource details…";
            const insert = await supabaseClient.from("course_resources").insert({
              course_id: courseId,
              module_id: selectedModule,
              title: String(values.get("title") || "").trim(),
              resource_type: values.get("resource_type"),
              description: String(values.get("description") || "").trim() || null,
              academic_year: year,
              resource_path: uploadedPath,
              original_file_name: file.name,
              mime_type: file.type,
              file_size_bytes: file.size,
              is_published: values.get("publish_now") === "on",
              uploaded_by: currentUser.id
            });
            if (insert.error) throw insert.error;
            showAlert("Tutorial material uploaded successfully.", "success");
            form.reset();
          } catch (error) {
            if (uploadedPath) {
              await supabaseClient.storage.from("course-resources").remove([uploadedPath]);
            }
            showAlert(error.message || "The tutorial material could not be uploaded.");
            button.disabled = false;
            button.textContent = "Upload tutorial material";
            return;
          }
          await renderAdminResources();
        });

        pageContent.querySelectorAll("[data-resource-open]").forEach(button => {

        pageContent.querySelectorAll("[data-resource-toggle]").forEach(button => {

            else showAlert("Tutorial material and file deleted.", "success");
            await renderAdminResources();
          });
        });
      }

      async function openCourseResource(path, downloadName, resourceId) {
        if (resourceId) {
          const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
          if (sessionError || !sessionData.session) {
            showAlert("Your session has expired. Please sign in again.");
            return;
          }
          const response = await fetch((supabaseUrl.endsWith("/") ? supabaseUrl.slice(0, -1) : supabaseUrl) + "/functions/v1/secure-course-document", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": supabaseKey,
              "Authorization": "Bearer " + sessionData.session.access_token
            },
            body: JSON.stringify({ action: "download", resourceId })
          });
          if (!response.ok) {
            let message = "The protected document could not be prepared.";
            try {
              const payload = await response.json();
              if (payload.error) message = payload.error;
            } catch (_) {}
            showAlert(message);
            return;
          }
          const blob = await response.blob();
          const objectUrl = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = objectUrl;
          anchor.download = downloadName || "Bright-Minds-document.pdf";
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          window.setTimeout(() => URL.revokeObjectURL(objectUrl), 30000);
          return;
        }

        const result = await supabaseClient.storage.from("course-resources")
          .createSignedUrl(path, 300, downloadName ? { download: downloadName } : {});
        if (result.error) {
          const message = /not found|object not found/i.test(result.error.message || "")
            ? "This document's stored file is missing. Please contact the administrator so it can be uploaded again."
            : (result.error.message || "The resource file could not be opened.");
          showAlert(message);
          return;
        }
        window.open(result.data.signedUrl, "_blank", "noopener,noreferrer");
      }

            </div>
            <form id="changePasswordForm" style="margin-top:20px;max-width:560px">
              <div class="form">
                <label>New password
                  <input id="newAccountPassword" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
                </label>
                <label>Confirm new password
                  <input id="confirmAccountPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Enter the new password again" required>
                </label>
              </div>
              <div class="inline-actions" style="margin-top:16px;align-items:center">
                <button class="btn" id="saveAccountPassword" type="submit">Update password</button>
                <span class="muted" style="font-size:11px">Use at least 8 characters.</span>
              </div>
            </form>
          </section>
        `;

        if (role !== "admin") {
          const passwordValue = document.getElementById("documentPasswordValue");
          const copyButton = document.getElementById("copyDocumentPassword");
          try {
            const { data, error } = await supabaseClient.functions.invoke("secure-course-document", {
              body: { action: "password" }
            });
            if (error) throw error;
            if (!data?.password) throw new Error(data?.error || "Password could not be loaded.");
            passwordValue.textContent = data.password;
            copyButton.disabled = false;
            copyButton.addEventListener("click", async () => {
              try {
                await navigator.clipboard.writeText(data.password);
                copyButton.textContent = "Copied";
                window.setTimeout(() => { copyButton.textContent = "Copy password"; }, 1800);
              } catch (_) {
                showAlert("Please select and copy the password manually.");
              }
            });
          } catch (error) {
            passwordValue.textContent = "Unavailable";
            showAlert(error.message || "Your document password could not be loaded.");
          }
        }

        document.getElementById("changePasswordForm")?.addEventListener("submit", async event => {
          event.preventDefault();
          clearAlert();
          const passwordInput = document.getElementById("newAccountPassword");
          const confirmInput = document.getElementById("confirmAccountPassword");
          const password = passwordInput.value;
          if (password.length < 8) {
            showAlert("Your new password must contain at least 8 characters.");
            passwordInput.focus();
            return;
          }
          if (password !== confirmInput.value) {
            showAlert("The passwords do not match. Please check them and try again.");
            confirmInput.focus();
            return;
          }
          const button = document.getElementById("saveAccountPassword");
          button.disabled = true;
          button.textContent = "Updating password…";
          const { error } = await supabaseClient.auth.updateUser({ password });
          button.disabled = false;
          button.textContent = "Update password";
          if (error) {
            showAlert(error.message || "We could not update your password. Please try again.");
            return;
          }
          passwordInput.value = "";
          confirmInput.value = "";
          showAlert("Your password has been updated successfully.", "success");
        });
      }


      async function renderAssessments() {
        return isAdmin() ? renderAdminAssessments() : renderStudentAssessments();
      }

      async function renderAdminAssessments() {
        const results = await Promise.all([
          supabaseClient.from("courses").select("id,title").order("title"),
          supabaseClient.from("assessments").select("id,title,status,duration_minutes,max_attempts,courses(title),assessment_questions(count)").order("created_at", {ascending:false})
        ]);
        if (results[0].error) throw results[0].error;
        if (results[1].error) throw results[1].error;
        const courses = results[0].data || [];
        const assessments = results[1].data || [];
        pageContent.innerHTML =
          '<div class="welcome"><h1>Assessments & results</h1><p>Create course tests, publish them for subscribed students and review automatically marked results.</p></div>' +
          '<div class="card" style="margin-bottom:18px"><h2 style="margin-top:0;color:var(--navy)">Create an assessment</h2>' +
          (courses.length ? '<form id="assessmentCreateForm"><div class="form">' +
            '<label>Assessment title<input name="title" required maxlength="180" placeholder="e.g. Mathematics — Algebra Test 1"></label>' +
            '<label>Course<select name="course_id" required>' + courses.map(x=>'<option value="'+x.id+'">'+escapeHTML(x.title)+'</option>').join("") + '</select></label>' +
            '<label>Time limit (minutes)<input name="duration_minutes" type="number" min="1" max="300" value="30" required></label>' +
            '<label>Allowed attempts<input name="max_attempts" type="number" min="1" max="10" value="1" required></label></div>' +
            '<label style="display:block;margin-top:12px">Instructions<textarea name="instructions" rows="2" maxlength="2000" placeholder="Instructions for students"></textarea></label>' +
            '<div id="assessmentQuestionHost" style="display:grid;gap:12px;margin-top:16px"></div>' +
            '<div class="inline-actions" style="margin-top:14px"><button class="btn secondary" type="button" id="addAssessmentQuestion">+ Add question</button><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="publish_now"> Publish after saving</label></div>' +
            '<button class="btn" id="saveAssessmentBtn" type="submit" style="margin-top:16px">Save assessment</button></form>' :
            '<div class="empty">Create a course first before adding an assessment.</div>') + '</div>' +
          '<div class="card"><div class="section-head" style="margin-top:0"><h2>Assessment library</h2><span class="pill">'+assessments.length+' total</span></div>' +
          (assessments.length ? '<div style="display:grid;gap:12px">' + assessments.map(x =>
            '<div style="padding:14px;border:1px solid var(--border);border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">' +
            '<div><strong style="color:var(--navy)">'+escapeHTML(x.title)+'</strong><div class="muted" style="font-size:12px;margin-top:5px">'+escapeHTML(x.courses?.title || "Course")+' · '+(x.assessment_questions?.[0]?.count || 0)+' questions · '+x.duration_minutes+' min · '+x.max_attempts+' attempt(s)</div><span class="pill" style="margin-top:7px">'+escapeHTML(x.status)+'</span></div>' +
            '<div class="inline-actions">' +
            '<button class="btn '+(x.status==="draft"?"":"secondary")+'" data-assessment-action="'+(x.status==="published"?"close":"publish")+'" data-id="'+x.id+'">'+(x.status==="published"?"Close":x.status==="closed"?"Reopen":"Publish")+'</button>' +
            '<button class="btn secondary" data-assessment-results="'+x.id+'">View results</button></div></div>').join("") + '</div>' :
            '<div class="empty">No assessments yet. Create your first assessment above.</div>') + '</div>';

        const host = document.getElementById("assessmentQuestionHost");
        let nextIndex = 0;
        function addQuestion() {
          const n = nextIndex++;
          const card = document.createElement("div");
          card.className = "card";
          card.dataset.qcard = String(n);
          card.style.cssText = "padding:15px;background:#F8FAFC;box-shadow:none";
          card.innerHTML = '<div class="section-head" style="margin-top:0"><strong>Question '+(n+1)+'</strong><button class="btn secondary" type="button" data-remove-q="'+n+'" '+(n===0?"disabled":"")+'>Remove</button></div>' +
            '<label>Question<textarea data-prompt required rows="2" maxlength="4000" placeholder="Enter the question"></textarea></label>' +
            '<div class="form" style="margin-top:10px">' +
            [0,1,2,3].map(i=>'<label>Option '+String.fromCharCode(65+i)+'<input data-option="'+i+'" required maxlength="500" placeholder="Answer option"></label>').join("") +
            '<label>Correct answer<select data-correct>'+[0,1,2,3].map(i=>'<option value="'+i+'">Option '+String.fromCharCode(65+i)+'</option>').join("")+'</select></label>' +
            '<label>Marks<input data-marks type="number" min="0.5" max="1000" step="0.5" value="1" required></label></div>';
          host.appendChild(card);
        }
        if (host) {
          addQuestion();
          document.getElementById("addAssessmentQuestion").addEventListener("click", addQuestion);
          host.addEventListener("click", event => {
            const btn = event.target.closest("[data-remove-q]");
            if (!btn) return;
            const card = host.querySelector('[data-qcard="'+btn.dataset.removeQ+'"]');
            if (card && host.querySelectorAll("[data-qcard]").length > 1) card.remove();
            [...host.querySelectorAll("[data-qcard]")].forEach((el,i)=>el.querySelector("strong").textContent="Question "+(i+1));
          });
          document.getElementById("assessmentCreateForm").addEventListener("submit", async event => {
            event.preventDefault();
            const form = event.currentTarget;
            if (!form.reportValidity()) return;
            const questions = [...host.querySelectorAll("[data-qcard]")].map(card=>({
              prompt:card.querySelector("[data-prompt]").value.trim(),
              options:[0,1,2,3].map(i=>card.querySelector('[data-option="'+i+'"]').value.trim()),
              correct_option:Number(card.querySelector("[data-correct]").value),
              marks:Number(card.querySelector("[data-marks]").value)
            }));
            if (questions.some(q=>!q.prompt || q.options.some(o=>!o))) { showAlert("Complete every question and all four options."); return; }
            const button=document.getElementById("saveAssessmentBtn");
            button.disabled=true; button.textContent="Saving…";
            const values=new FormData(form);
            try {
              const created=await supabaseClient.from("assessments").insert({
                course_id:values.get("course_id"),title:values.get("title").trim(),
                instructions:values.get("instructions").trim()||null,
                duration_minutes:Number(values.get("duration_minutes")),
                max_attempts:Number(values.get("max_attempts")),status:"draft",created_by:currentUser.id
              }).select("id").single();
              if(created.error) throw created.error;
              for(let i=0;i<questions.length;i++){
                const q=questions[i];
                const saved=await supabaseClient.from("assessment_questions").insert({
                  assessment_id:created.data.id,prompt:q.prompt,options:q.options,marks:q.marks,position:i+1
                }).select("id").single();
                if(saved.error) throw saved.error;
                const key=await supabaseClient.from("assessment_answer_keys").insert({
                  question_id:saved.data.id,correct_option:q.correct_option
                });
                if(key.error) throw key.error;
              }
              if(values.get("publish_now")==="on"){
                const published=await supabaseClient.from("assessments").update({status:"published"}).eq("id",created.data.id);
                if(published.error) throw published.error;
              }
              showAlert("Assessment saved successfully.","success");
              await renderAdminAssessments();
            } catch(error) {
              showAlert(error.message||"The assessment could not be saved. Check the assessment library for a draft.");
              button.disabled=false; button.textContent="Save assessment";
            }
          });
        }
        pageContent.querySelectorAll("[data-assessment-action]").forEach(btn=>btn.addEventListener("click",async()=>{
          const status=btn.dataset.assessmentAction==="publish"?"published":"closed";
          const result=await supabaseClient.from("assessments").update({status}).eq("id",btn.dataset.id);
          if(result.error){showAlert(result.error.message);return;}
          await renderAdminAssessments();
        }));
        pageContent.querySelectorAll("[data-assessment-results]").forEach(btn=>btn.addEventListener("click",()=>renderAdminAssessmentResults(btn.dataset.assessmentResults)));
      }

      async function renderAdminAssessmentResults(id) {
        const results=await Promise.all([
          supabaseClient.from("assessments").select("id,title,courses(title)").eq("id",id).single(),
          supabaseClient.from("assessment_attempts").select("id,student_id,started_at,submitted_at,score,max_score,status").eq("assessment_id",id).order("started_at",{ascending:false})
        ]);
        if(results[0].error) throw results[0].error;
        if(results[1].error) throw results[1].error;
        const assessment=results[0].data, attempts=results[1].data||[];
        const ids=[...new Set(attempts.map(a=>a.student_id))];
        let names={};
        if(ids.length){
          const profiles=await supabaseClient.from("profiles").select("id,full_name").in("id",ids);
          if(!profiles.error) (profiles.data||[]).forEach(p=>names[p.id]=p.full_name);
        }
        pageContent.innerHTML='<div class="welcome"><h1>Assessment results</h1><p>'+escapeHTML(assessment.title)+' · '+escapeHTML(assessment.courses?.title||"")+'</p></div><div class="card"><div class="section-head" style="margin-top:0"><h2>Student attempts</h2><button class="btn secondary" id="backAssessmentList">Back</button></div>'+
          (attempts.length?'<div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Started</th><th>Result</th><th>Status</th></tr></thead><tbody>'+attempts.map(a=>'<tr><td>'+escapeHTML(names[a.student_id]||"Student")+'</td><td>'+new Date(a.started_at).toLocaleString()+'</td><td>'+(a.score===null?"—":a.score+" / "+a.max_score+" ("+(a.max_score?Math.round(a.score/a.max_score*100):0)+"%)")+'</td><td>'+escapeHTML(a.status)+'</td></tr>').join("")+'</tbody></table></div>':'<div class="empty">No students have attempted this assessment yet.</div>')+'</div>';
        document.getElementById("backAssessmentList").addEventListener("click",renderAdminAssessments);
      }

      async function renderStudentAssessments() {
        const results=await Promise.all([
          supabaseClient.from("assessments").select("id,title,instructions,duration_minutes,max_attempts,courses(title),assessment_questions(count)").eq("status","published").order("created_at",{ascending:false}),
          supabaseClient.from("assessment_attempts").select("id,assessment_id,started_at,score,max_score,status").eq("student_id",currentUser.id).order("started_at",{ascending:false})
        ]);
        if(results[0].error) throw results[0].error;
        if(results[1].error) throw results[1].error;
        const assessments=results[0].data||[], attempts=results[1].data||[];
        pageContent.innerHTML='<div class="welcome"><h1>Assessments</h1><p>Test your understanding, practise under timed conditions and track your results.</p></div>'+
          (assessments.length?'<div style="display:grid;gap:14px">'+assessments.map(a=>{
            const own=attempts.filter(t=>t.assessment_id===a.id), active=own.find(t=>t.status==="in_progress"), done=own.find(t=>t.status==="submitted"), remaining=Math.max(0,a.max_attempts-own.length);
            return '<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:190px"><span class="pill">'+escapeHTML(a.courses?.title||"Course")+'</span><h2 style="margin:12px 0 6px;color:var(--navy)">'+escapeHTML(a.title)+'</h2><p class="muted" style="font-size:13px">'+escapeHTML(a.instructions||"Answer the questions before the time limit expires.")+'</p><div class="muted" style="font-size:12px">'+a.duration_minutes+' minutes · '+(a.assessment_questions?.[0]?.count||0)+' questions · '+remaining+' attempt(s) remaining</div>'+(done?'<p style="font-size:13px;font-weight:700;color:var(--navy)">Latest result: '+done.score+'/'+done.max_score+' ('+(done.max_score?Math.round(done.score/done.max_score*100):0)+'%)</p>':'')+'</div><button class="btn" data-start-assessment="'+a.id+'" '+(!active&&remaining<=0?"disabled":"")+'>'+(active?"Continue attempt":remaining>0?"Start assessment":"Attempts used")+'</button></div></div>';
          }).join("")+'</div>':'<div class="empty"><strong>No assessments available yet.</strong><p>Assessments published for your active courses will appear here.</p></div>')+
          (attempts.length?'<div class="card" style="margin-top:18px"><h2 style="margin-top:0;color:var(--navy)">Your assessment history</h2>'+attempts.map(a=>'<div style="padding:10px 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px"><span>'+new Date(a.started_at).toLocaleString()+'</span><strong>'+(a.status==="submitted"?a.score+'/'+a.max_score+" · "+(a.max_score?Math.round(a.score/a.max_score*100):0)+"%":escapeHTML(a.status))+'</strong></div>').join("")+'</div>':'');
        pageContent.querySelectorAll("[data-start-assessment]").forEach(btn=>btn.addEventListener("click",async()=>{
          btn.disabled=true;btn.textContent="Opening…";
          const started=await supabaseClient.rpc("start_assessment_attempt",{p_assessment_id:btn.dataset.startAssessment});
          if(started.error){showAlert(started.error.message);await renderStudentAssessments();return;}
          await renderStudentAssessmentAttempt(btn.dataset.startAssessment,started.data);
        }));
      }

      async function renderStudentAssessmentAttempt(assessmentId,attemptId) {
        const results=await Promise.all([
          supabaseClient.from("assessments").select("id,title,instructions,duration_minutes").eq("id",assessmentId).single(),
          supabaseClient.from("assessment_questions").select("id,prompt,options,marks,position").eq("assessment_id",assessmentId).order("position")
        ]);
        if(results[0].error) throw results[0].error;
        if(results[1].error) throw results[1].error;
        const assessment=results[0].data, questions=results[1].data||[];
        if(!questions.length) throw new Error("This assessment has no questions yet.");
        pageContent.innerHTML='<div class="welcome"><h1>'+escapeHTML(assessment.title)+'</h1><p>'+escapeHTML(assessment.instructions||"Select one answer for each question.")+'</p></div>'+
          '<div class="card" style="margin-bottom:14px;border-left:4px solid var(--teal)"><strong>Timed assessment · '+assessment.duration_minutes+' minutes</strong><p class="muted" style="font-size:12px;margin:5px 0 0">The timer starts when you begin. Submit before time expires.</p></div><form id="studentAssessmentForm">'+
          questions.map((q,i)=>'<div class="card" style="margin-bottom:14px"><strong style="color:var(--navy)">Question '+(i+1)+' · '+q.marks+' mark(s)</strong><p style="font-weight:600;line-height:1.6">'+escapeHTML(q.prompt)+'</p><div style="display:grid;gap:8px">'+q.options.map((o,n)=>'<label style="display:flex;gap:10px;padding:11px;border:1px solid var(--border);border-radius:9px"><input type="radio" name="answer_'+q.id+'" value="'+n+'"><span><strong>'+String.fromCharCode(65+n)+'.</strong> '+escapeHTML(o)+'</span></label>').join("")+'</div></div>').join("")+
          '<div class="inline-actions"><button class="btn" id="submitAssessmentBtn" type="submit">Submit answers</button><button class="btn secondary" type="button" id="leaveAssessmentBtn">Leave for now</button></div></form>';
        document.getElementById("leaveAssessmentBtn").addEventListener("click",renderStudentAssessments);
        document.getElementById("studentAssessmentForm").addEventListener("submit",async event=>{
          event.preventDefault();
          if(!window.confirm("Submit your answers now? You cannot change them afterwards.")) return;
          const answers=questions.map(q=>{
            const selected=pageContent.querySelector('input[name="answer_'+q.id+'"]:checked');
            return selected?{question_id:q.id,selected_option:Number(selected.value)}:null;
          }).filter(Boolean);
          const btn=document.getElementById("submitAssessmentBtn");btn.disabled=true;btn.textContent="Marking…";
          const submitted=await supabaseClient.rpc("submit_assessment_attempt",{p_attempt_id:attemptId,p_answers:answers});
          if(submitted.error){showAlert(submitted.error.message);btn.disabled=false;btn.textContent="Submit answers";return;}
          const result=Array.isArray(submitted.data)?submitted.data[0]:submitted.data;
          pageContent.innerHTML='<div class="card" style="max-width:650px;margin:30px auto;text-align:center;padding:30px"><div style="font-size:36px;color:var(--teal)">✓</div><h1 style="color:var(--navy);font-family:Manrope">Assessment submitted</h1><p class="muted">Your answers have been marked automatically.</p><div style="font-size:38px;font-weight:800;color:var(--navy);margin:18px 0">'+result.score+' / '+result.max_score+'</div><span class="pill">'+(result.max_score?Math.round(result.score/result.max_score*100):0)+'%</span><div style="margin-top:22px"><button class="btn" id="returnAssessments">Return to assessments</button></div></div>';
          document.getElementById("returnAssessments").addEventListener("click",renderStudentAssessments);
        });
      }

      function renderPlaceholder(message) {

        pageContent.innerHTML = `
          <div class="welcome">
            <h1>${escapeHTML(titles[currentPage])}</h1>
          </div>

          <div class="empty">
            ${escapeHTML(message)}
          </div>
        `;
      }

      document
        .getElementById("mainNav")
        .addEventListener("click", event => {

          const button = event.target.closest("button[data-page]");

          if (button) {
            renderPage(button.dataset.page);
            closeMobileMenu();
          }
        });

      document
        .getElementById("adminNav")
        .addEventListener("click", event => {

          const button = event.target.closest("button[data-page]");

          if (button) {
            renderPage(button.dataset.page);
          }
        });

      const sidebar = document.getElementById("sidebar");
      const menuToggle = document.getElementById("menuToggle");
      const sidebarBackdrop = document.getElementById("sidebarBackdrop");

      function closeMobileMenu() {
        sidebar.classList.remove("open");
        sidebarBackdrop.classList.remove("open");
        menuToggle.setAttribute("aria-expanded", "false");
        menuToggle.setAttribute("aria-label", "Open navigation");
        document.body.style.overflow = "";
      }

      function toggleMobileMenu() {
        const isOpen = sidebar.classList.toggle("open");
        sidebarBackdrop.classList.toggle("open", isOpen);
        menuToggle.setAttribute("aria-expanded", String(isOpen));
        menuToggle.setAttribute("aria-label", isOpen ? "Close navigation" : "Open navigation");
        document.body.style.overflow = isOpen ? "hidden" : "";
      }

      menuToggle.addEventListener("click", toggleMobileMenu);
      sidebarBackdrop.addEventListener("click", closeMobileMenu);
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeMobileMenu();
      });

      window.addEventListener("resize", () => {
        if (window.innerWidth > 900) closeMobileMenu();
      });

      document
        .getElementById("signOutBtn")
        .addEventListener("click", async () => {

          if (!supabaseClient) return;

          const { error } = await supabaseClient.auth.signOut();

          if (error) {
            showAlert(error.message);
            return;
          }

          window.location.replace("./index.html");
        });

      init().catch(error => {
        pageContent.innerHTML = `
          <div class="empty">
            The dashboard could not be started.
          </div>
        `;

        showAlert(error.message || "An unexpected error occurred.");
      });

    })();
  </script>

</body>
</html>
