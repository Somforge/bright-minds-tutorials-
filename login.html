
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102A43">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <title>Sign In | Bright Minds Tutorials</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js?v=20261121-1"></script>

    <style>
        :root {
            --navy: #102A43;
            --turquoise: #00B8A9;
            --light: #F4F7FA;
            --text: #243B53;
            --muted: #627D98;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "DM Sans", sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--light);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 38px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(16, 42, 67, 0.09);
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-mark {
            width: 50px;
            height: 50px;
            display: grid;
            place-items: center;
            position: relative;
            margin-bottom: 13px;
            border-radius: 14px;
            background: var(--navy);
            color: white;
            font: 800 28px "Manrope", sans-serif;
            box-shadow: 0 7px 18px rgba(16,42,67,.16);
        }

        .brand-mark::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            top: 6px;
            right: 6px;
            border-radius: 50%;
            background: var(--turquoise);
        }

        .brand h1 {
            color: var(--navy);
            font: 800 25px "Manrope", sans-serif;
            letter-spacing: 1px;
        }

        .brand span {
            color: var(--turquoise);
        }

        .brand .brand-mark {
            color: #fff;
        }

        .brand p {
            color: var(--muted);
            font-size: 13px;
            margin-top: 8px;
        }

        h2 {
            color: var(--navy);
            font-size: 23px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            color: var(--text);
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #D9E2EC;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--turquoise);
        }

        button {
            width: 100%;
            border: none;
            background: var(--turquoise);
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #009D91;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .forgot {
            display: block;
            text-align: right;
            color: var(--turquoise);
            font-size: 13px;
            text-decoration: none;
            margin-top: -7px;
            margin-bottom: 20px;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .error {
            display: block;
            background: #FDECEC;
            color: #B42318;
        }

        .success {
            display: block;
            background: #E7F8F5;
            color: #087F70;
        }

        .bottom {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: var(--muted);
        }

        .bottom a {
            color: var(--turquoise);
            text-decoration: none;
            font-weight: bold;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #829AB1;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="brand">
        <span class="brand-mark" aria-hidden="true">B</span>
        <h1>BRIGHT <span>MINDS</span></h1>
        <p>Learn. Understand. Excel.</p>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">
        Sign in to access your Bright Minds learning dashboard.
    </p>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="loginForm">

        <label for="email">Email address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <a href="#" class="forgot" id="forgotPassword">
            Forgot your password?
        </a>

        <button type="submit" id="loginButton">
            Sign In
        </button>

    </form>

    <div class="bottom">
        Don't have an account?
        <a href="register.html">Create an account</a>
    </div>

    <a href="index.html" class="home">
        ← Back to homepage
    </a>

    <div class="footer">
        © <span id="year"></span> Bright Minds Tutorials.
        All rights reserved.
    </div>

</div>

<script>
"use strict";

const messageBox = document.getElementById("message");
const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");

document.getElementById("year").textContent =
    new Date().getFullYear();

let supabaseClient = null;

function showMessage(message, type) {
    messageBox.textContent = message;
    messageBox.className = "message " + type;
}

function setLoading(loading) {
    loginButton.disabled = loading;
    loginButton.textContent = loading ? "Signing in..." : "Sign In";
}

function getSupabaseClient() {
    if (
        !window.supabase ||
        !window.BRIGHT_MINDS_CONFIG ||
        !window.BRIGHT_MINDS_CONFIG.SUPABASE_URL ||
        !window.BRIGHT_MINDS_CONFIG.SUPABASE_KEY
    ) {
        return null;
    }

    return window.supabase.createClient(
        window.BRIGHT_MINDS_CONFIG.SUPABASE_URL,
        window.BRIGHT_MINDS_CONFIG.SUPABASE_KEY
    );
}

supabaseClient = getSupabaseClient();

if (!supabaseClient) {
    showMessage(
        "The application configuration could not be loaded. Please contact support.",
        "error"
    );
    loginButton.disabled = true;
}

// Redirect users who already have a valid session.
async function checkExistingSession() {
    if (!supabaseClient) return;

    const { data, error } =
        await supabaseClient.auth.getSession();

    if (error) {
        console.error("Session check error:", error);
        return;
    }

    if (data.session) {
        window.location.replace("dashboard.html");
    }
}

checkExistingSession();

// Sign in.
loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (!supabaseClient) {
        showMessage(
            "The application is currently unavailable. Please try again later.",
            "error"
        );
        return;
    }

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    setLoading(true);
    messageBox.className = "message";

    try {
        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            showMessage(error.message, "error");
            setLoading(false);
            return;
        }

        if (data.session) {
            showMessage("Sign-in successful. Opening your dashboard...", "success");
            window.location.replace("dashboard.html");
            return;
        }

        showMessage(
            "Sign-in could not be completed. Please try again.",
            "error"
        );

        setLoading(false);

    } catch (error) {
        console.error("Sign-in error:", error);

        showMessage(
            "An unexpected error occurred. Please try again.",
            "error"
        );

        setLoading(false);
    }
});

// Password recovery.
document.getElementById("forgotPassword")
    .addEventListener("click", async function(event) {

        event.preventDefault();

        if (!supabaseClient) return;

        const email =
            document.getElementById("email").value.trim();

        if (!email) {
            showMessage(
                "Enter your email address first, then select Forgot your password.",
                "error"
            );
            return;
        }

        showMessage(
            "Sending password reset instructions...",
            "success"
        );

        try {
            const { error } =
                await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin +
                        window.location.pathname.replace(
                            "login.html",
                            "index.html"
                        )
                });

            if (error) {
                showMessage(error.message, "error");
            } else {
                showMessage(
                    "If an account exists for this email, password reset instructions will be sent to it.",
                    "success"
                );
            }

        } catch (error) {
            console.error("Password recovery error:", error);

            showMessage(
                "Unable to send password reset instructions. Please try again.",
                "error"
            );
        }
    });
</script>

</body>
</html>
